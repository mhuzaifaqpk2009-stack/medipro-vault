name: Repair current UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          p=Path('src/routes/app.operations.tsx')
          s=p.read_text()
          s=s.replace('className="flex w-full gap-1 overflow-x-auto bg-muted p-1"','className="flex w-full min-h-12 items-stretch gap-1 overflow-x-auto bg-muted p-1"')
          s=s.replace('className="shrink-0 whitespace-nowrap border border-border/40 bg-background/50 hover:bg-background"','className="h-10 shrink-0 whitespace-nowrap border border-border/40 bg-background/50 px-3 hover:bg-background"')
          p.write_text(s)
          
          p=Path('src/routes/app.medicines.tsx')
          s=p.read_text()
          s=s.replace('className="ml-auto flex w-full flex-wrap items-center justify-end gap-2 xl:w-auto"','className="ml-auto flex min-w-0 w-full flex-1 flex-wrap items-center justify-end gap-2 xl:w-auto"')
          s=s.replace('className="h-9 w-36"','className="h-9 w-32 shrink-0"')
          s=s.replace('className="h-9 w-56 pl-8"','className="h-9 w-44 xl:w-56 pl-8"')
          s=s.replace('className="h-9 w-40"','className="h-9 w-32 xl:w-40 shrink-0"')
          s=s.replace('className="shrink-0" {...pinContext','className="shrink-0 min-w-fit whitespace-nowrap" {...pinContext')
          p.write_text(s)
          
          p=Path('src/routes/app.settings.tsx')
          s=p.read_text()
          s=s.replace('value="rackaccess">Rack Access</TabsTrigger>', 'value="rackaccess" className="min-w-[110px]">Rack Access</TabsTrigger>')
          s=s.replace('<TabsContent value="rackaccess" className="mt-0"><RackAccessSettings /></TabsContent>', '<TabsContent value="rackaccess" className="mt-0 block"><RackAccessSettings /></TabsContent>')
          s=s.replace('<TabsContent value="shortcuts"><KeyboardSettingsPanel />', '<TabsContent value="shortcuts"><div className="static"><KeyboardSettingsPanel /></div>')
          p.write_text(s)
          
          p=Path('src/components/KeyboardSettingsPanel.tsx')
          s=p.read_text().replace('className="surface-card mt-4 p-6"','className="surface-card static relative z-auto mt-4 w-full p-6"')
          p.write_text(s)
          PY
      - name: Commit repairs and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/app.operations.tsx src/routes/app.medicines.tsx src/routes/app.settings.tsx src/components/KeyboardSettingsPanel.tsx
          git commit -m "fix: repair operations, medicines and settings layout" || true
          git push
          git rm .github/workflows/repair-current-ui.yml || true
          git commit -m "chore: remove temporary UI repair workflow" || true
          git push

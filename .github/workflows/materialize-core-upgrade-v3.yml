name: Materialize core upgrade v3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply embedded upgrade patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, textwrap
          wf=Path('.github/workflows/apply-core-upgrade.yml').read_text()
          m=re.search(r"python3 <<'PY'\n(.*?)\n\s*PY\n",wf,re.S)
          if not m: raise SystemExit('upgrade script block not found')
          exec(compile(textwrap.dedent(m.group(1)),'embedded-upgrade.py','exec'),{})
          PY
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat: strengthen transactions units and pharmacy finance" || exit 0
          git push origin HEAD:main

name: Move notification settings
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/move-notifications.yml
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move notification controls
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/routes/app.settings.tsx')
          text = p.read_text(encoding='utf-8')
          network = re.compile(r'<TabsContent value="network"><DeploymentSettings />\s*<section className="surface-card mt-4 p-6">.*?</section></TabsContent>', re.S)
          replacement = '<TabsContent value="network"><DeploymentSettings /></TabsContent>'
          text, count = network.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not locate legacy notification block in Computer mode tab')
          marker = '<div className="relative mt-4"><Search className="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" />'
          quick = '''<section className="mt-5 rounded-lg border bg-muted/10 p-4"><div className="mb-3 flex items-center gap-2"><Bell className="h-4 w-4 text-primary" /><div><h3 className="text-sm font-semibold">Quick notification controls</h3><p className="text-[11px] text-muted-foreground">These commonly used alerts are kept here with the full notification catalog.</p></div></div><div className="grid gap-3 md:grid-cols-2"><label className="flex items-center justify-between gap-3 rounded-md border bg-background p-3"><span className="text-sm">When a user deletes a medicine</span><Switch checked={s.notifyOnDeleteMedicine === true} onCheckedChange={(v)=>set("notifyOnDeleteMedicine",v)} /></label><label className="flex items-center justify-between gap-3 rounded-md border bg-background p-3"><span className="text-sm">When a user adds a medicine</span><Switch checked={s.notifyOnAddMedicine === true} onCheckedChange={(v)=>set("notifyOnAddMedicine",v)} /></label><label className="flex items-center justify-between gap-3 rounded-md border bg-background p-3"><span className="text-sm">When a user adds a customer</span><Switch checked={s.notifyOnAddCustomer === true} onCheckedChange={(v)=>set("notifyOnAddCustomer",v)} /></label><label className="flex items-center justify-between gap-3 rounded-md border bg-background p-3"><span className="text-sm">When a force sale is completed</span><Switch checked={s.notifyOnForceSale !== false} onCheckedChange={(v)=>set("notifyOnForceSale",v)} /></label><div className="rounded-md border bg-background p-3"><label className="flex items-center justify-between gap-3"><span className="text-sm">Large sale alert</span><Switch checked={s.notifyOnLargeSale === true} onCheckedChange={(v)=>set("notifyOnLargeSale",v)} /></label>{s.notifyOnLargeSale && <div className="mt-2"><Input type="number" placeholder="Threshold amount" value={s.largeSaleThreshold || ""} onChange={(e)=>set("largeSaleThreshold",Number(e.target.value)||0)} /></div>}</div></div></section>'''
          if marker not in text:
              raise SystemExit('Notification search marker not found')
          text = text.replace(marker, quick + marker, 1)
          p.write_text(text, encoding='utf-8')
          # Remove this one-shot workflow after the edit.
          wf = Path('.github/workflows/move-notifications.yml')
          wf.unlink()
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Move notifications into Notifications settings'
          git push

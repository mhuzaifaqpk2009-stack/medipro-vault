name: Materialize core pharmacy upgrade
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply the existing upgrade patch without running validation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          wf=Path('.github/workflows/apply-core-upgrade.yml').read_text()
          marker='python3 <<\'PY\'\n'
          if marker not in wf: raise SystemExit('upgrade script not found')
          script=wf.split(marker,1)[1].split('\nPY\n',1)[0]
          exec(compile(script,'embedded-upgrade.py','exec'),{})
          PY
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat: strengthen transactions units and pharmacy finance" || exit 0
          git push origin HEAD:main

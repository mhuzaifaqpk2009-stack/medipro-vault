name: Apply core pharmacy upgrade
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply changes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          R=Path('.')
          def rd(p): return (R/p).read_text()
          def wr(p,s):
              (R/p).parent.mkdir(parents=True,exist_ok=True); (R/p).write_text(s)
          def req(s,o,n,p):
              if o not in s: raise SystemExit(f'missing pattern: {p}: {o[:80]}')
              return s.replace(o,n,1)

          p='src/domain/schema.ts'; s=rd(p)
          s=s.replace('export interface Medicine { id: string;','export interface MedicineUnitOption { id: string; label: string; factor: number; price: number; }\nexport interface MedicineUnitConfig { baseUnit: string; options: MedicineUnitOption[]; }\nexport interface Expense { id: string; date: string; category: string; description?: string; amount: number; paymentMethod: "cash" | "card" | "online"; createdBy?: string; }\nexport interface CashDrawerSession { id: string; openedAt: string; openingCash: number; closedAt?: string; closingCash?: number; expectedCash?: number; difference?: number; closedBy?: string; }\nexport interface Medicine { id: string;',1)
          s=s.replace('description?: string; pinOrder?: "first" | "last"; }','description?: string; pinOrder?: "first" | "last"; unitConfig?: MedicineUnitConfig; }',1)
          s=s.replace('batchAllocations?: { batchId: string; quantity: number; costPrice: number }[];','batchAllocations?: { batchId: string; quantity: number; costPrice: number }[]; unitLabel?: string; unitQuantity?: number; unitFactor?: number;',1)
          s=s.replace('prescriptions?: Prescription[]; }','prescriptions?: Prescription[]; expenses?: Expense[]; cashDrawer?: CashDrawerSession; }',1)
          s=s.replace('export const SCHEMA_VERSION = 3;','export const SCHEMA_VERSION = 4;',1); wr(p,s)

          wr('src/lib/unit-engine.ts', '''import type { Medicine, MedicineUnitOption, ProjectData } from "@/domain/schema";\nexport function unitOptions(m?: Medicine): MedicineUnitOption[] { return m?.unitConfig?.options?.filter(x=>x.factor>0&&x.label.trim())??[]; }\nexport function defaultUnit(m?: Medicine): MedicineUnitOption|undefined { return unitOptions(m)[0]; }\nexport function baseQuantity(q:number,f:number){ return Math.max(0,Math.floor(Number(q||0)*Number(f||1))); }\nexport function configureUnits(data:ProjectData,id:string,base:string,options:MedicineUnitOption[]){const m=data.medicines.find(x=>x.id===id);if(!m)return;m.unitConfig=options.length?{baseUnit:base||"piece",options}:undefined;}\n''')
          wr('src/lib/finance-engine.ts', '''import type { ProjectData } from "@/domain/schema";\nimport { saleTotal } from "@/lib/sale-math";\nfunction inRange(d:string,f?:string,t?:string){const k=d.slice(0,10);return(!f||k>=f)&&(!t||k<=t);}\nexport function financeSummary(data:ProjectData,from?:string,to?:string){let revenue=0,cogs=0,rr=0,rc=0;for(const s of data.sales){if(s.status!=="completed"||!inRange(s.date,from,to))continue;revenue+=saleTotal(s);cogs+=s.items.reduce((n,i)=>n+(i.costPriceAtSale??data.medicines.find(m=>m.id===i.medicineId)?.purchasePrice??0)*i.quantity,0);}for(const r of data.settings.saleReturns??[]){if(!inRange(r.date,from,to))continue;const s=data.sales.find(x=>x.id===r.saleId);for(const i of r.items){rr+=i.salePrice*i.quantity;rc+=(s?.items.find(x=>x.medicineId===i.medicineId)?.costPriceAtSale??0)*i.quantity;}}const expenses=(data.settings.expenses??[]).filter(e=>inRange(e.date,from,to)).reduce((n,e)=>n+e.amount,0);const netRevenue=revenue-rr;const netCogs=Math.max(0,cogs-rc);const grossProfit=netRevenue-netCogs;return{revenue:netRevenue,cogs:netCogs,grossProfit,expenses,netProfit:grossProfit-expenses,returns:rr};}\nexport function expectedCash(data:ProjectData,opening=0,from?:string){let sales=0,payments=0,expenses=0;for(const s of data.sales)if(s.status==="completed"&&inRange(s.date,from))sales+=s.payments.filter(p=>p.method==="cash").reduce((n,p)=>n+p.amount,0);for(const e of data.settings.customerLedger??[])if(e.type==="payment"&&inRange(e.date,from))payments+=e.amount;for(const e of data.settings.expenses??[])if(e.paymentMethod==="cash"&&inRange(e.date,from))expenses+=e.amount;return{expected:opening+sales+payments-expenses};}\n''')
          wr('src/lib/transaction-engine.ts', '''import type { ProjectData, SaleReturn, PurchaseReturn } from "@/domain/schema";\nimport { uid } from "@/lib/format";\nimport { allocationsForSaleItem, syncInventoryBatches } from "@/lib/inventory-engine";\nexport function cancelSale(data:ProjectData,id:string,reason="Sale cancelled",user?:string){const sale=data.sales.find(s=>s.id===id);if(!sale)throw new Error("Sale not found");if(sale.status!=="completed")throw new Error("Only a completed sale can be cancelled");syncInventoryBatches(data);for(const item of sale.items)for(const a of allocationsForSaleItem(item)){const b=(data.settings.inventoryBatches??[]).find(x=>x.id===a.batchId);if(b)b.quantity+=a.quantity;}const credit=sale.payments.filter(p=>p.method==="credit").reduce((n,p)=>n+p.amount,0);if(sale.customerId&&credit){const c=data.customers.find(x=>x.id===sale.customerId);if(c)c.balance=Math.max(0,(c.balance??0)-credit);data.settings.customerLedger=[...(data.settings.customerLedger??[]),{id:uid("cl_"),customerId:sale.customerId,date:new Date().toISOString(),type:"adjustment",amount:-credit,reference:sale.invoiceNumber,note:reason,createdBy:user} as any];}sale.status="cancelled";sale.notes=[sale.notes,reason].filter(Boolean).join(" · ");syncInventoryBatches(data);}\nexport function recordSaleReturn(data:ProjectData,id:string,requested:Record<string,number>,reason="Customer return",user?:string):SaleReturn{const sale=data.sales.find(s=>s.id===id);if(!sale)throw new Error("Sale not found");if(sale.status!=="completed")throw new Error("Only a completed sale can be returned");const prev=data.settings.saleReturns??[];const items:any[]=[];for(const line of sale.items){const already=prev.filter(r=>r.saleId===sale.id).flatMap(r=>r.items).filter(i=>i.medicineId===line.medicineId).reduce((n,i)=>n+i.quantity,0);let rem=Math.min(Math.max(0,requested[line.medicineId]??0),Math.max(0,line.quantity-already));if(!rem)continue;for(const a of allocationsForSaleItem(line)){if(!rem)break;const take=Math.min(rem,a.quantity);const b=(data.settings.inventoryBatches??[]).find(x=>x.id===a.batchId);if(b)b.quantity+=take;items.push({medicineId:line.medicineId,quantity:take,salePrice:line.salePrice,batchId:a.batchId});rem-=take;}if(rem){const m=data.medicines.find(x=>x.id===line.medicineId);const b={id:uid("batch_ret_"),sourceKey:`sale-return:${sale.id}:${Date.now()}:${line.medicineId}`,medicineId:line.medicineId,batchNumber:m?.batchNumber,barcode:m?.barcode,quantity:rem,initialQuantity:rem,purchasePrice:line.costPriceAtSale??m?.purchasePrice??0,expiryDate:m?.expiryDate,receivedDate:new Date().toISOString()};data.settings.inventoryBatches=[...(data.settings.inventoryBatches??[]),b];items.push({medicineId:line.medicineId,quantity:rem,salePrice:line.salePrice,batchId:b.id});}}if(!items.length)throw new Error("No returnable quantity entered");const ret:SaleReturn={id:uid("sret_"),saleId:sale.id,date:new Date().toISOString(),customerId:sale.customerId,items,reason,createdBy:user};data.settings.saleReturns=[...prev,ret];const value=items.reduce((n,i)=>n+i.salePrice*i.quantity,0);if(sale.customerId){const c=data.customers.find(x=>x.id===sale.customerId);if(c)c.balance=Math.max(0,(c.balance??0)-value);data.settings.customerLedger=[...(data.settings.customerLedger??[]),{id:uid("cl_"),customerId:sale.customerId,date:ret.date,type:"return",amount:-value,reference:sale.invoiceNumber,note:reason,createdBy:user} as any];}syncInventoryBatches(data);return ret;}\nexport function recordPurchaseReturn(data:ProjectData,id:string,requested:Record<string,number>,reason="Supplier return",user?:string):PurchaseReturn{const p=data.purchases.find(x=>x.id===id);if(!p)throw new Error("Purchase not found");const prev=data.settings.purchaseReturns??[];const items:any[]=[];for(let index=0;index<p.items.length;index++){const line=p.items[index];const rem=Math.max(0,Math.min(requested[line.medicineId]??0,line.quantity));if(!rem)continue;const b=(data.settings.inventoryBatches??[]).find(x=>x.sourceKey===`purchase:${p.id}:${index}`);if(!b||b.quantity<rem)throw new Error("Not enough stock in the purchased batch for this return");b.quantity-=rem;items.push({medicineId:line.medicineId,quantity:rem,purchasePrice:line.purchasePrice,batchId:b.id});}if(!items.length)throw new Error("No returnable quantity entered");const ret:PurchaseReturn={id:uid("pret_"),purchaseId:p.id,date:new Date().toISOString(),supplierId:p.supplierId,items,reason,createdBy:user};data.settings.purchaseReturns=[...prev,ret];syncInventoryBatches(data);return ret;}\n''')

          p='src/lib/sale-math.ts';s=rd(p);s=s.replace('export function saleSubtotal(sale: Sale): number {\n  return sale.items.reduce((a, l) => a + l.salePrice * l.quantity * (1 - l.discountPercent / 100), 0);\n}','function billedUnits(l:{quantity:number;unitQuantity?:number}){return l.unitQuantity??l.quantity;}\nfunction baseUnits(l:{quantity:number;unitQuantity?:number;unitFactor?:number}){return l.unitQuantity!=null?l.unitQuantity*(l.unitFactor??1):l.quantity;}\nexport function saleSubtotal(sale: Sale): number { return sale.items.reduce((a,l)=>a+l.salePrice*billedUnits(l)*(1-l.discountPercent/100),0); }',1);s=s.replace('(historicalCost ?? m?.purchasePrice ?? 0) * l.quantity;','(historicalCost ?? m?.purchasePrice ?? 0) * baseUnits(l);',1);s=s.replace('lines: { salePrice: number; quantity: number; discountPercent: number }[]','lines: { salePrice: number; quantity: number; discountPercent: number; unitQuantity?: number }[]',1);s=s.replace('const subtotal = lines.reduce((a, l) => a + l.salePrice * l.quantity * (1 - l.discountPercent / 100), 0);','const subtotal = lines.reduce((a,l)=>a+l.salePrice*(l.unitQuantity??l.quantity)*(1-l.discountPercent/100),0);',1);wr(p,s)

          p='src/routes/app.sales.tsx';s=rd(p);s=s.replace('import { allocateStock, syncInventoryBatches, weightedCost } from "@/lib/inventory-engine";','import { allocateStock, syncInventoryBatches, weightedCost } from "@/lib/inventory-engine";\nimport { defaultUnit, unitOptions, baseQuantity } from "@/lib/unit-engine";',1)
          s=req(s,'function add(medId:string){const med=data.medicines.find(m=>m.id===medId);if(!med)return;setCart(c=>{const i=c.findIndex(l=>l.medicineId===medId);const nextQty=i>=0?c[i].quantity+1:1;if(!confirmForce(med,nextQty))return c;if(i>=0){const copy=[...c];copy[i]={...copy[i],quantity:nextQty,forced:nextQty>med.stockQuantity,forcedSale:nextQty>med.stockQuantity};return copy}return[{medicineId:medId,quantity:1,salePrice:med.salePrice,discountPercent:0,name:med.name,forced:1>med.stockQuantity,forcedSale:1>med.stockQuantity},...c]});setQ("")}', 'function add(medId:string){const med=data.medicines.find(m=>m.id===medId);if(!med)return;const opt=defaultUnit(med);const factor=opt?.factor??1;const price=opt?.price??med.salePrice;setCart(c=>{const i=c.findIndex(l=>l.medicineId===medId);const nextBase=i>=0?c[i].quantity+factor:factor;if(!confirmForce(med,nextBase))return c;if(i>=0){const copy=[...c];const old=copy[i];const uq=(old.unitQuantity??(old.quantity/(old.unitFactor??1)))+1;copy[i]={...old,quantity:nextBase,unitQuantity:uq,unitFactor:factor,unitLabel:opt?.label,salePrice:price,forced:nextBase>med.stockQuantity,forcedSale:nextBase>med.stockQuantity};return copy}return[{medicineId:medId,quantity:factor,unitQuantity:1,unitFactor:factor,unitLabel:opt?.label,salePrice:price,discountPercent:0,name:med.name,forced:factor>med.stockQuantity,forcedSale:factor>med.stockQuantity},...c]});setQ("")}',p)
          s=req(s,'function setQuantity(i:number,value:number){const clean=Math.max(1,Math.floor(value||1));const line=cart[i];if(!line)return;const med=data.medicines.find(m=>m.id===line.medicineId);if(!med)return;if(!confirmForce(med,clean))return;setCart(c=>c.map((l,idx)=>idx===i?{...l,quantity:clean,forced:clean>med.stockQuantity,forcedSale:clean>med.stockQuantity}:l))}','function setQuantity(i:number,value:number){const clean=Math.max(1,Math.floor(value||1));const line=cart[i];if(!line)return;const med=data.medicines.find(m=>m.id===line.medicineId);if(!med)return;const factor=line.unitFactor??1;const base=baseQuantity(clean,factor);if(!confirmForce(med,base))return;setCart(c=>c.map((l,idx)=>idx===i?{...l,quantity:base,unitQuantity:clean,forced:base>med.stockQuantity,forcedSale:base>med.stockQuantity}:l))}',p)
          marker='function updLine(i:number,patch:Partial<typeof cart[number]>){setCart(c=>c.map((l,idx)=>idx===i?{...l,...patch}:l))}';s=req(s,marker,marker+'\n  function changeUnit(i:number,optionId:string){const line=cart[i];const med=line&&data.medicines.find(m=>m.id===line.medicineId);const opt=med&&unitOptions(med).find(o=>o.id===optionId);if(!line||!med||!opt)return;const uq=Math.max(1,line.unitQuantity??1);const base=baseQuantity(uq,opt.factor);if(!confirmForce(med,base))return;setCart(c=>c.map((l,idx)=>idx===i?{...l,quantity:base,unitQuantity:uq,unitFactor:opt.factor,unitLabel:opt.label,salePrice:opt.price,forced:base>med.stockQuantity,forcedSale:base>med.stockQuantity}:l))}',p)
          cell='<td className="p-2"><Input type="number" min={1} className="h-8 text-right" value={l.quantity||""} onChange={e=>setQuantity(i,+e.target.value)}/></td>'
          cellnew='<td className="p-2"><div className="flex flex-col items-end gap-1">{unitOptions(data.medicines.find(m=>m.id===l.medicineId)).length>0&&<Select value={unitOptions(data.medicines.find(m=>m.id===l.medicineId)).find(o=>o.label===l.unitLabel)?.id??unitOptions(data.medicines.find(m=>m.id===l.medicineId))[0]?.id} onValueChange={v=>changeUnit(i,v)}><SelectTrigger className="h-7 w-24 text-[10px]"><SelectValue placeholder="Unit"/></SelectTrigger><SelectContent>{unitOptions(data.medicines.find(m=>m.id===l.medicineId)).map(o=><SelectItem key={o.id} value={o.id}>{o.label}</SelectItem>)}</SelectContent></Select>}<Input type="number" min={1} className="h-8 w-20 text-right" value={l.unitQuantity??l.quantity} onChange={e=>setQuantity(i,+e.target.value)}/>{l.unitFactor&&l.unitFactor>1&&<span className="text-[10px] text-muted-foreground">{l.quantity} {data.medicines.find(m=>m.id===l.medicineId)?.unitConfig?.baseUnit??"base"}</span>}</div></td>'
          s=req(s,cell,cellnew,p);wr(p,s)

          p='src/routes/app.bills.tsx';s=rd(p);s=s.replace('import type { Sale } from "@/domain/schema";','import type { Sale } from "@/domain/schema";\nimport { cancelSale } from "@/lib/transaction-engine";',1);s=req(s,'function removeBill(sale: Sale) {\n    if (!window.confirm(`Delete bill ${sale.invoiceNumber}? The invoice counter is not affected.`)) return;\n    mutate((d) => { d.sales = d.sales.filter((x) => x.id !== sale.id); });\n    if (selected?.id === sale.id) setSelected(null);\n    toast.success("Bill deleted");\n  }','function removeBill(sale: Sale) {\n    if (sale.status !== "completed") return toast.error("Only a completed bill can be cancelled");\n    if (!window.confirm(`Cancel bill ${sale.invoiceNumber}? Stock and customer credit will be reversed and history will remain.`)) return;\n    try { mutate(d => { cancelSale(d, sale.id, "Bill cancelled from Bills", undefined); }); } catch(e) { toast.error(e instanceof Error ? e.message : "Bill could not be cancelled"); return; }\n    setSelected(null); toast.success("Bill cancelled and inventory/credit reversed");\n  }',p).replace('title="Delete this bill"','title="Cancel this bill"',1);wr(p,s)

          p='src/routes/app.operations.tsx';s=rd(p);s=s.replace('import type { InventoryBatch, PurchaseReturn, SaleReturn } from "@/domain/schema";','import type { InventoryBatch, PurchaseReturn, SaleReturn, MedicineUnitOption } from "@/domain/schema";\nimport { recordPurchaseReturn, recordSaleReturn } from "@/lib/transaction-engine";\nimport { financeSummary, expectedCash } from "@/lib/finance-engine";',1);s=s.replace('grid-cols-5">','grid-cols-7">',1);marker='{canSuppliers&&<TabsTrigger value="suppliers"><Truck className="mr-1 h-4 w-4"/>Supplier Ledger</TabsTrigger>}';s=req(s,marker,marker+'<TabsTrigger value="units"><Layers className="mr-1 h-4 w-4"/>Units</TabsTrigger><TabsTrigger value="finance"><ArrowUpRight className="mr-1 h-4 w-4"/>Finance</TabsTrigger>',p)
          pat=r'function makeSaleReturn\(\).*?\n  const customerRows='
          rep='''function makeSaleReturn(){if(!selectedSale)return toast.error("Select a sale");try{mutate(d=>{recordSaleReturn(d,selectedSale.id,saleReturnQty,"Customer return",user?.username)});toast.success("Sale return recorded and stock restored");setSaleReturnQty({});}catch(e){toast.error(e instanceof Error?e.message:"Sale return failed")}}\n  function makePurchaseReturn(){if(!selectedPurchase)return toast.error("Select a purchase");try{mutate(d=>{recordPurchaseReturn(d,selectedPurchase.id,purchaseReturnQty,"Supplier return",user?.username)});toast.success("Purchase return recorded and batch stock reduced");setPurchaseReturnQty({});}catch(e){toast.error(e instanceof Error?e.message:"Purchase return failed")}}\n  const customerRows='''
          s,n=re.subn(pat,rep,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('return function pattern not found')
          marker='{canReturns&&<TabsContent value="returns"'
          s=req(s,marker,'<TabsContent value="units" className="mt-4"><UnitManager /></TabsContent><TabsContent value="finance" className="mt-4"><FinanceManager /></TabsContent>'+marker,p);wr(p,s)

          wr('src/components/operations/UnitManager.tsx','''import { useState } from "react";\nimport { toast } from "sonner";\nimport { useProjectStore } from "@/store/project-store";\nimport { uid, money } from "@/lib/format";\nimport { Input } from "@/components/ui/input";\nimport { Button } from "@/components/ui/button";\nimport { Label } from "@/components/ui/label";\nimport { Select, SelectContent, SelectItem, SelectTrigger, SelectValue } from "@/components/ui/select";\nimport type { MedicineUnitOption } from "@/domain/schema";\nexport function UnitManager(){const data=useProjectStore(s=>s.data!);const mutate=useProjectStore(s=>s.mutate);const [medicineId,setMedicineId]=useState(data.medicines[0]?.id??"");const [baseUnit,setBaseUnit]=useState("piece");const [label,setLabel]=useState("");const [factor,setFactor]=useState(1);const [price,setPrice]=useState(0);const m=data.medicines.find(x=>x.id===medicineId);const options=m?.unitConfig?.options??[];function add(){if(!label.trim()||factor<1)return toast.error("Enter a unit and conversion factor");const o:MedicineUnitOption={id:uid("unit_"),label:label.trim(),factor:Math.floor(factor),price:Number(price||0)};mutate(d=>{const x=d.medicines.find(v=>v.id===medicineId);if(x)x.unitConfig={baseUnit:baseUnit.trim()||"piece",options:[...(x.unitConfig?.options??[]).filter(v=>v.label.toLowerCase()!==o.label.toLowerCase()),o]}});setLabel("");toast.success("Selling unit added")}function remove(id:string){mutate(d=>{const x=d.medicines.find(v=>v.id===medicineId);if(!x?.unitConfig)return;x.unitConfig.options=x.unitConfig.options.filter(v=>v.id!==id);if(!x.unitConfig.options.length)x.unitConfig=undefined})}return <div className="grid gap-4 lg:grid-cols-2"><div className="surface-card p-5"><h2 className="font-display font-semibold">Box / Strip / Tablet conversion</h2><p className="mt-1 text-xs text-muted-foreground">Stock is stored in the smallest/base unit. The POS converts each selling unit automatically.</p><div className="mt-4 grid gap-3"><div><Label>Medicine</Label><Select value={medicineId} onValueChange={v=>{setMedicineId(v);const x=data.medicines.find(a=>a.id===v);setBaseUnit(x?.unitConfig?.baseUnit??"piece");setPrice(x?.salePrice??0)}}><SelectTrigger><SelectValue/></SelectTrigger><SelectContent>{data.medicines.map(x=><SelectItem key={x.id} value={x.id}>{x.name}</SelectItem>)}</SelectContent></Select></div><div><Label>Smallest unit</Label><Input value={baseUnit} onChange={e=>setBaseUnit(e.target.value)} placeholder="tablet"/></div><div className="grid grid-cols-3 gap-3"><div><Label>Sell as</Label><Input value={label} onChange={e=>setLabel(e.target.value)} placeholder="Strip"/></div><div><Label>Base qty</Label><Input type="number" min={1} value={factor} onChange={e=>setFactor(Number(e.target.value))}/></div><div><Label>Price</Label><Input type="number" min={0} value={price} onChange={e=>setPrice(Number(e.target.value))}/></div></div><Button onClick={add}>Add unit</Button></div></div><div className="surface-card p-5"><h2 className="font-display font-semibold">Configured units</h2><div className="mt-3 space-y-2">{options.length===0?<p className="text-sm text-muted-foreground">No conversion configured.</p>:options.map(o=><div key={o.id} className="flex items-center justify-between rounded-lg border p-3"><span><b>{o.label}</b><span className="ml-2 text-xs text-muted-foreground">1 = {o.factor} {m?.unitConfig?.baseUnit??"base"} · {money(o.price,data.settings.currencySymbol||"$")}</span></span><Button variant="ghost" size="sm" onClick={()=>remove(o.id)}>Remove</Button></div>)}</div></div></div>}\n''')

          wr('src/components/operations/FinanceManager.tsx','''import { useState } from "react";\nimport { toast } from "sonner";\nimport { useProjectStore } from "@/store/project-store";\nimport { useSession } from "@/store/session-store";\nimport { uid, money } from "@/lib/format";\nimport { Input } from "@/components/ui/input";\nimport { Button } from "@/components/ui/button";\nimport { Select, SelectContent, SelectItem, SelectTrigger, SelectValue } from "@/components/ui/select";\nimport { financeSummary, expectedCash } from "@/lib/finance-engine";\nexport function FinanceManager(){const data=useProjectStore(s=>s.data!);const mutate=useProjectStore(s=>s.mutate);const user=useSession(s=>s.user);const sym=data.settings.currencySymbol||"$";const [category,setCategory]=useState("Rent");const [desc,setDesc]=useState("");const [amount,setAmount]=useState(0);const [method,setMethod]=useState<"cash"|"card"|"online">("cash");const [opening,setOpening]=useState(0);const [closing,setClosing]=useState(0);const summary=financeSummary(data);const drawer=data.settings.cashDrawer;const open=!!drawer&&!drawer.closedAt;function expense(){if(amount<=0)return toast.error("Enter an amount");mutate(d=>{d.settings.expenses=[...(d.settings.expenses??[]),{id:uid("exp_"),date:new Date().toISOString(),category:category||"Other",description:desc||undefined,amount:Number(amount),paymentMethod:method,createdBy:user?.username}]});setAmount(0);setDesc("");toast.success("Expense recorded")}function openDrawer(){if(open)return;mutate(d=>{d.settings.cashDrawer={id:uid("drawer_"),openedAt:new Date().toISOString(),openingCash:Number(opening)}});toast.success("Cash drawer opened")}function closeDrawer(){if(!drawer||!open)return;const ex=expectedCash(data,drawer.openingCash,drawer.openedAt.slice(0,10)).expected;mutate(d=>{if(d.settings.cashDrawer){d.settings.cashDrawer.closedAt=new Date().toISOString();d.settings.cashDrawer.closingCash=Number(closing);d.settings.cashDrawer.expectedCash=ex;d.settings.cashDrawer.difference=Number(closing)-ex;d.settings.cashDrawer.closedBy=user?.username}});toast.success("Cash drawer closed")}return <div className="grid gap-4"><div className="grid gap-4 md:grid-cols-4"><div className="surface-card p-4"><p className="text-xs text-muted-foreground">Revenue</p><b className="text-xl">{money(summary.revenue,sym)}</b></div><div className="surface-card p-4"><p className="text-xs text-muted-foreground">COGS</p><b className="text-xl">{money(summary.cogs,sym)}</b></div><div className="surface-card p-4"><p className="text-xs text-muted-foreground">Gross profit</p><b className="text-xl">{money(summary.grossProfit,sym)}</b></div><div className="surface-card p-4"><p className="text-xs text-muted-foreground">Net profit</p><b className="text-xl">{money(summary.netProfit,sym)}</b></div></div><div className="grid gap-4 lg:grid-cols-2"><div className="surface-card p-5"><h2 className="font-display font-semibold">Expenses</h2><div className="mt-3 grid gap-3"><Input value={category} onChange={e=>setCategory(e.target.value)} placeholder="Rent / salary / electricity"/><Input value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Description"/><div className="grid grid-cols-2 gap-3"><Input type="number" min={0} value={amount||""} onChange={e=>setAmount(Number(e.target.value))} placeholder="Amount"/><Select value={method} onValueChange={v=>setMethod(v as any)}><SelectTrigger><SelectValue/></SelectTrigger><SelectContent><SelectItem value="cash">Cash</SelectItem><SelectItem value="card">Card</SelectItem><SelectItem value="online">Online</SelectItem></SelectContent></Select></div><Button onClick={expense}>Record expense</Button></div></div><div className="surface-card p-5"><h2 className="font-display font-semibold">Cash drawer</h2><p className="mt-1 text-xs text-muted-foreground">Track opening cash, expected cash and closing difference.</p>{open?<div className="mt-3 grid gap-3"><p className="rounded border p-3 text-sm">Expected: <b>{money(expectedCash(data,drawer!.openingCash,drawer!.openedAt.slice(0,10)).expected,sym)}</b></p><Input type="number" min={0} value={closing||""} onChange={e=>setClosing(Number(e.target.value))} placeholder="Actual closing cash"/><Button onClick={closeDrawer}>Close drawer</Button></div>:<div className="mt-3 grid gap-3"><Input type="number" min={0} value={opening||""} onChange={e=>setOpening(Number(e.target.value))} placeholder="Opening cash"/><Button onClick={openDrawer}>Open drawer</Button>{drawer?.closedAt&&<p className="text-xs text-muted-foreground">Last difference: {money(drawer.difference??0,sym)}</p>}</div>}</div></div></div>}\n''')


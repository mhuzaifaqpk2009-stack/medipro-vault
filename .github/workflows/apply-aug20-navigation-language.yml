                  content='''<TabsContent value="language"><section className="surface-card p-6"><div className="flex items-start justify-between gap-4"><div><h2 className="font-display text-base font-semibold">Language</h2><p className="text-xs text-muted-foreground">English is the default. Choose another language and the visible MediPro interface will translate supported labels immediately.</p></div><span className="rounded-full bg-primary/10 px-3 py-1 text-xs font-medium">Default: English</span></div><div className="mt-4"><Input value={languageSearch} onChange={e=>setLanguageSearch(e.target.value)} placeholder="Search language..." aria-label="Search language" /></div><div className="mt-4 grid gap-2 sm:grid-cols-2 lg:grid-cols-3">{APP_LANGUAGES.filter(l=>`${l.name} ${l.nativeName} ${l.code}`.toLowerCase().includes(languageSearch.toLowerCase())).map(l=><button key={l.code} type="button" onClick={()=>{setLanguage(l.code);toast.success(`${l.name} selected`);}} className={`rounded-lg border p-3 text-left hover:bg-muted ${getLanguage()===l.code?'border-primary bg-primary/5':''}`}><b className="block">{l.nativeName}</b><span className="text-xs text-muted-foreground">{l.name} · {l.code}</span></button>)}</div></section></TabsContent>'''
                  s=s.replace('<TabsContent value="danger">',content+'<TabsContent value="danger">')
                  settings.write_text(s,encoding='utf-8')

          # ---------- pin/menu fixes + right click for every in-page tab ----------
          pins=root/'src/lib/pins.tsx'
          if pins.exists():
              s=pins.read_text(encoding='utf-8')
              s=s.replace('import { useEffect, useRef, useState } from "react";', 'import { useEffect, useRef, useState } from "react";\nimport { useNavigate, useRouterState } from "@tanstack/react-router";')
              s=s.replace('const [target, setTarget] = useState<MenuTarget | null>(null);', 'const navigate = useNavigate(); const pathname = useRouterState({ select: s => s.location.pathname }); const [target, setTarget] = useState<MenuTarget | null>(null);')
              old='useEffect(() => { openFn = (t, p) => { setTarget(t); setAt(p); setRenaming(false); setName(settingsRef.current?.tabRenames?.[t.id] ?? ""); }; return () => { openFn = null; }; }, []);'
              new='useEffect(() => { openFn = (t, p) => { setTarget(t); setAt(p); setRenaming(false); setName(settingsRef.current?.tabRenames?.[t.id] ?? ""); }; const onTabContext = (e: MouseEvent) => { const el=(e.target as HTMLElement)?.closest?.("[role=tab]") as HTMLElement|null; if(!el || el.closest("[data-sidebar]") || el.closest("aside")) return; const label=(el.textContent||el.getAttribute("aria-label")||"Tab").trim(); const value=el.getAttribute("data-value") || el.getAttribute("value") || label; e.preventDefault(); e.stopPropagation(); openFn?.({id:`tab:${pathname}:${value}`,label,kind:"nav-tab",to:pathname,canRename:true} as MenuTarget,{x:e.clientX,y:e.clientY}); }; document.addEventListener("contextmenu",onTabContext,true); return () => { openFn = null; document.removeEventListener("contextmenu",onTabContext,true); }; }, [pathname]);'
              if old in s: s=s.replace(old,new)
              s=s.replace('function addToMacro() { if (!target.to) return; sessionStorage.setItem("medipro:macro-prefill-route", target.to); window.location.href = "/app/macros"; }', 'function addToMacro() { if (!target.to) return; sessionStorage.setItem("medipro:macro-prefill-route", target.to); navigate({ to: "/app/macros" as any }); close(); }')
              s=s.replace('onClick={() => { window.location.href = target.to!; }}', 'onClick={() => { navigate({ to: target.to! as any }); close(); }}')
              s=s.replace('const isNav = target.kind === "nav" && !!target.to && NAV.some((n) => n.to === target.to);', 'const isNav = (target.kind === "nav" || target.kind === "nav-tab") && !!target.to && NAV.some((n) => n.to === target.to); const isTab = target.kind === "nav-tab";')
              s=s.replace('{isNav && isAdmin && !renaming && <div className="mt-1 border-t pt-1">', '{(isNav || isTab) && isAdmin && !renaming && <div className="mt-1 border-t pt-1">')
              s=s.replace('{isNav && isAdmin && <button className="mt-1 flex w-full items-center gap-2 rounded border-t px-2 py-2 text-left text-sm hover:bg-accent" onClick={addToMacro}>', '{(isNav || isTab) && isAdmin && <button className="mt-1 flex w-full items-center gap-2 rounded border-t px-2 py-2 text-left text-sm hover:bg-accent" onClick={addToMacro}>')
              pins.write_text(s,encoding='utf-8')

          # ---------- macro prefill opens automatically ----------
          macros=root/'src/routes/app.macros.tsx'
          if macros.exists():
              s=macros.read_text(encoding='utf-8')
              s=s.replace('import { useState } from "react";', 'import { useEffect, useState } from "react";')
              marker='const user = useSession((s) => s.user); const data = useProjectStore((s) => s.data); const mutate = useProjectStore((s) => s.mutate); const navigate = useNavigate(); const macros = data?.settings.macros ?? []; const [draft, setDraft] = useState<PharmacyMacro | null>(null);'
              repl=marker+'\n  useEffect(() => { const prefill=sessionStorage.getItem("medipro:macro-prefill-route"); if(!prefill || user?.role!=="admin") return; sessionStorage.removeItem("medipro:macro-prefill-route"); const to=prefill as MacroRoute; setDraft({ id: crypto.randomUUID(), name:"New Navigation Macro", description:"Macro created from a pharmacy navigation tab.", shortcut:"Ctrl+Alt+1", enabled:true, steps:[{id:crypto.randomUUID(),label:ROUTES.find(([,r])=>r===to)?.[0]??"Open selected tab",to}] }); }, [user]);'
              if marker in s and 'Macro created from a pharmacy navigation tab.' in s and 'useEffect(() => { const prefill=' not in s: s=s.replace(marker,repl)
              macros.write_text(s,encoding='utf-8')

          # ---------- workflow template crash-proofing ----------
          wf=root/'src/routes/app.workflows.tsx'
          if wf.exists():
              s=wf.read_text(encoding='utf-8')
              old='function newFlow(template?: Flow) { setEditingFlow(template ? structuredClone({ ...template, id: `custom-${Date.now()}`, title: `${template.title} — Custom`, custom: true }) : { id: `custom-${Date.now()}`, title: "", description: "", permission: "operations", steps: [{ id: `step-${Date.now()}`, label: "", to: "/app/operations" }], custom: true }); }'
              new='function newFlow(template?: Flow) { try { const base = template ? JSON.parse(JSON.stringify(template)) as Flow : { id: `custom-${Date.now()}`, title: "", description: "", permission: "operations", steps: [{ id: `step-${Date.now()}`, label: "", to: "/app/operations" }] as Step[], custom: true }; if (template) { base.id=`custom-${Date.now()}`; base.title=`${template.title} — Custom`; base.custom=true; } setEditingFlow(base); } catch { toast.error("Could not open workflow template"); } }'
              if old in s: s=s.replace(old,new)
              s=s.replace('onClick={() => newFlow(DEFAULT_FLOWS.find((f) => f.id === "opening"))}', 'onClick={() => newFlow(DEFAULT_FLOWS.find((f) => f.id === "opening"))}')
              wf.write_text(s,encoding='utf-8')


  fr: { Dashboard:'Tableau de bord', Medicines:'Médicaments', Inventory:'Inventaire', Purchases:'Achats', Customers:'Clients', Suppliers:'Fournisseurs', Reports:'Rapports', Settings:'Paramètres', Messages:'Messages', Save:'Enregistrer', Cancel:'Annuler', Search:'Rechercher', Notifications:'Notifications', Open:'Ouvrir', Close:'Fermer' },
  de: { Dashboard:'Dashboard', Medicines:'Medikamente', Inventory:'Inventar', Purchases:'Einkäufe', Customers:'Kunden', Suppliers:'Lieferanten', Reports:'Berichte', Settings:'Einstellungen', Messages:'Nachrichten', Save:'Speichern', Cancel:'Abbrechen', Search:'Suchen', Notifications:'Benachrichtigungen', Open:'Öffnen', Close:'Schließen' },
  tr: { Dashboard:'Gösterge Paneli', Medicines:'İlaçlar', Inventory:'Stok', Purchases:'Satın Almalar', Customers:'Müşteriler', Suppliers:'Tedarikçiler', Reports:'Raporlar', Settings:'Ayarlar', Messages:'Mesajlar', Save:'Kaydet', Cancel:'İptal', Search:'Ara', Notifications:'Bildirimler', Open:'Aç', Close:'Kapat' },
  zh: { Dashboard:'仪表板', Medicines:'药品', Inventory:'库存', Purchases:'采购', Customers:'客户', Suppliers:'供应商', Reports:'报告', Settings:'设置', Messages:'消息', Save:'保存', Cancel:'取消', Search:'搜索', Notifications:'通知', Open:'打开', Close:'关闭' },
  ru: { Dashboard:'Панель', Medicines:'Лекарства', Inventory:'Склад', Purchases:'Закупки', Customers:'Клиенты', Suppliers:'Поставщики', Reports:'Отчёты', Settings:'Настройки', Messages:'Сообщения', Save:'Сохранить', Cancel:'Отмена', Search:'Поиск', Notifications:'Уведомления', Open:'Открыть', Close:'Закрыть' },
}

export function getLanguage(): string { return localStorage.getItem('medicore.language') || 'en' }
export function setLanguage(code: string) { localStorage.setItem('medicore.language', code); window.dispatchEvent(new CustomEvent('medicore:language-change', { detail: code })) }
export function translateText(text: string, code=getLanguage()) { return DICT[code]?.[text] ?? text }
export function installLanguageObserver() {
  const apply = () => {
    const code=getLanguage(); document.documentElement.lang=code;
    if(code==='en') return;
    const walker=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT)
    const nodes: Text[]=[]; let n: Node|null; while(n=walker.nextNode()) nodes.push(n as Text)
    for(const node of nodes){ const value=node.nodeValue?.trim(); if(!value || value.length>80) continue; const translated=translateText(value,code); if(translated!==value) node.nodeValue=node.nodeValue!.replace(value,translated) }
  }
  const observer=new MutationObserver(()=>{ if((window as any).__medicoreTranslating) return; (window as any).__medicoreTranslating=true; requestAnimationFrame(()=>{ try{apply()}finally{(window as any).__medicoreTranslating=false} }) })
  observer.observe(document.body,{subtree:true,childList:true}); apply(); return ()=>observer.disconnect()
}
''', encoding='utf-8')

          # ---------- global voice search overlay ----------
          voice = root/'src/components/VoiceSearchOverlay.tsx'
          voice.write_text(r'''import { Mic, MicOff } from 'lucide-react';
import { useEffect, useState } from 'react';
import { Button } from '@/components/ui/button';

export function VoiceSearchOverlay(){
  const [target,setTarget]=useState<HTMLInputElement|HTMLTextAreaElement|null>(null); const [listening,setListening]=useState(false); const [pos,setPos]=useState({left:0,top:0});
  useEffect(()=>{ const update=()=>{ const el=document.activeElement as HTMLInputElement|HTMLTextAreaElement|null; if(!el || !('value' in el) || !(el instanceof HTMLInputElement || el instanceof HTMLTextAreaElement)) { setTarget(null); return } const hint=`${el.placeholder||''} ${el.getAttribute('aria-label')||''} ${el.name||''}`.toLowerCase(); if(!hint.includes('search') && !hint.includes('scan')) { setTarget(null); return } const r=el.getBoundingClientRect(); setTarget(el); setPos({left:Math.max(8,r.right-38),top:r.top+(r.height-32)/2}) }; window.addEventListener('focusin',update); window.addEventListener('scroll',update,true); window.addEventListener('resize',update); update(); return ()=>{window.removeEventListener('focusin',update);window.removeEventListener('scroll',update,true);window.removeEventListener('resize',update)} },[]);
  if(!target) return null;
  const start=()=>{ const Speech=(window as any).SpeechRecognition||(window as any).webkitSpeechRecognition; if(!Speech){ alert('Voice search is not supported by this Windows installation.'); return } const r=new Speech(); r.lang=document.documentElement.lang||'en-US'; r.interimResults=false; r.continuous=false; r.onstart=()=>setListening(true); r.onerror=()=>setListening(false); r.onend=()=>setListening(false); r.onresult=(e:any)=>{ const text=e.results?.[0]?.[0]?.transcript||''; const setter=Object.getOwnPropertyDescriptor(Object.getPrototypeOf(target),'value')?.set; setter?.call(target,text); target.dispatchEvent(new Event('input',{bubbles:true})); target.dispatchEvent(new Event('change',{bubbles:true})); target.focus() }; r.start(); };
  return <Button type="button" size="icon" variant={listening?'default':'ghost'} className="fixed z-[200] h-8 w-8 rounded-full shadow-sm" style={{left:pos.left,top:pos.top}} title="Voice search" aria-label="Voice search" onMouseDown={e=>e.preventDefault()} onClick={start}>{listening?<MicOff className="h-4 w-4"/>:<Mic className="h-4 w-4"/>}</Button>
}
''', encoding='utf-8')

          # ---------- App integration ----------
          app=root/'src/App.tsx'
          if app.exists():
              s=app.read_text(encoding='utf-8')
              if 'VoiceSearchOverlay' not in s:
                  s=s.replace('import {', 'import { VoiceSearchOverlay } from "@/components/VoiceSearchOverlay";\nimport { installLanguageObserver } from "@/lib/language";\nimport { useEffect } from "react";\nimport {', 1)
                  s=s.replace('export default function App()', 'export default function App()', 1)
                  # add observer in first component body
                  m=re.search(r'(function App\([^)]*\)\s*\{)',s)
                  if m:
                      insert='\\n  useEffect(() => installLanguageObserver(), []);'
                      s=s[:m.end()]+insert+s[m.end():]
                  s=s.replace('return (', 'return (\n    <><VoiceSearchOverlay />', 1)
                  s=s.replace('</', '</', 1)
                  # safer: if return fragment was not closed, add before final component close
                  if '<VoiceSearchOverlay />' in s and '</>' not in s:
                      s=s.rsplit('}',1)[0]+'  </>\n}\n'
                  app.write_text(s,encoding='utf-8')

          # ---------- Settings language tab ----------
          settings=root/'src/routes/app.settings.tsx'

          audit.write_text('''# What\'s New — v1.0.3\n\n- Navigation context actions now work with router-safe Open and Custom Macro actions.\n- Right-click any in-page navigation tab to access pin/management actions.\n- Workflow Builder templates are crash-resistant.\n- Settings includes searchable language selection with English as the default.\n- Voice search appears on search/scan fields when the browser/Windows speech API is available.\n- Ctrl+K selection remains visible while navigating.\n''',encoding='utf-8')

      - name: Commit changes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: navigation context actions, language, workflow templates and voice search" || true
          git rm -f .github/workflows/apply-aug20-navigation-language.yml || true
          git add -A
          git commit -m "chore: remove one-shot apply workflow" || true
          git push

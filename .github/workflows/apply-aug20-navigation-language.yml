name: Apply Aug 20 navigation language fixes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply aug20 fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          import json, re

          root = Path('.')

          # ---------- version ----------
          p = root/'package.json'
          if p.exists():
              data=json.loads(p.read_text(encoding='utf-8'))
              data['version']='1.0.3'
              p.write_text(json.dumps(data, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          lock=root/'package-lock.json'
          if lock.exists():
              data=json.loads(lock.read_text(encoding='utf-8'))
              data['version']='1.0.3'
              if isinstance(data.get('packages'),dict) and '' in data['packages']:
                  data['packages']['']['version']='1.0.3'
              lock.write_text(json.dumps(data, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')

          # ---------- language engine ----------
          lang = root/'src/lib/language.ts'
          lang.write_text(r'''export type AppLanguage = { code: string; name: string; nativeName: string };

export const APP_LANGUAGES: AppLanguage[] = [
  { code: 'en', name: 'English', nativeName: 'English' },
  { code: 'ur', name: 'Urdu', nativeName: 'اردو' },
  { code: 'ar', name: 'Arabic', nativeName: 'العربية' },
  { code: 'hi', name: 'Hindi', nativeName: 'हिन्दी' },
  { code: 'bn', name: 'Bengali', nativeName: 'বাংলা' },
  { code: 'pa', name: 'Punjabi', nativeName: 'ਪੰਜਾਬੀ' },
  { code: 'fa', name: 'Persian', nativeName: 'فارسی' },
  { code: 'tr', name: 'Turkish', nativeName: 'Türkçe' },
  { code: 'id', name: 'Indonesian', nativeName: 'Bahasa Indonesia' },
  { code: 'ms', name: 'Malay', nativeName: 'Bahasa Melayu' },
  { code: 'es', name: 'Spanish', nativeName: 'Español' },
  { code: 'fr', name: 'French', nativeName: 'Français' },
  { code: 'de', name: 'German', nativeName: 'Deutsch' },
  { code: 'it', name: 'Italian', nativeName: 'Italiano' },
  { code: 'pt', name: 'Portuguese', nativeName: 'Português' },
  { code: 'ru', name: 'Russian', nativeName: 'Русский' },
  { code: 'zh', name: 'Chinese', nativeName: '中文' },
  { code: 'ja', name: 'Japanese', nativeName: '日本語' },
  { code: 'ko', name: 'Korean', nativeName: '한국어' },
]

const DICT: Record<string, Record<string,string>> = {
  ur: { Dashboard:'ڈیش بورڈ', Medicines:'ادویات', Inventory:'انوینٹری', Purchases:'خریداری', Customers:'گاہک', Suppliers:'سپلائرز', Reports:'رپورٹس', Settings:'ترتیبات', Messages:'پیغامات', 'Workflow Engine':'ورک فلو انجن', 'Save now':'اب محفوظ کریں', Save:'محفوظ کریں', Cancel:'منسوخ', Search:'تلاش', 'Add medicine':'دوا شامل کریں', 'Add user':'صارف شامل کریں', 'Rack Access':'ریک رسائی', 'Notifications':'اطلاعات', 'Backup & data':'بیک اپ اور ڈیٹا', Shortcuts:'شارٹ کٹس', Help:'مدد', 'What\'s New':'نیا کیا ہے', Open:'کھولیں', Close:'بند کریں', 'New Medicine':'نئی دوا', 'New Customer':'نیا گاہک', 'New Supplier':'نیا سپلائر', 'New Purchase':'نئی خریداری' },
  ar: { Dashboard:'لوحة التحكم', Medicines:'الأدوية', Inventory:'المخزون', Purchases:'المشتريات', Customers:'العملاء', Suppliers:'الموردون', Reports:'التقارير', Settings:'الإعدادات', Messages:'الرسائل', 'Save now':'حفظ الآن', Save:'حفظ', Cancel:'إلغاء', Search:'بحث', Notifications:'الإشعارات', Shortcuts:'الاختصارات', Open:'فتح', Close:'إغلاق' },

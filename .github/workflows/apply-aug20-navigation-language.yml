          top=root/'src/components/AppTopbar.tsx'
          if top.exists():
              s=top.read_text(encoding='utf-8')
              if 'v1.0.3 — Navigation and language' not in s:
                  needle='const HELP_SECTIONS = [\n  { title: "What\'s New", items: ['
                  repl='const HELP_SECTIONS = [\n  { title: "What\'s New", items: [\n    ["v1.0.3 — Navigation, language and workflow fixes", "Right-click navigation tabs now support pinning and management. Dashboard Open uses the router correctly, Add to Custom Macro opens the macro editor safely, workflow templates are crash-resistant, Language settings now support searchable language selection, and voice search is available on search fields."],'
                  s=s.replace(needle,repl)

                  s=s.replace('const [notificationSearch, setNotificationSearch] = useState("");', 'const [notificationSearch, setNotificationSearch] = useState("");\n  const [languageSearch, setLanguageSearch] = useState("");')
                  tab='<TabsTrigger className="min-h-10 shrink-0 whitespace-nowrap px-3 text-sm font-medium" value="language">Language</TabsTrigger>'

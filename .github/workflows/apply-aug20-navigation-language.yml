                  s=s.replace('return <><VoiceSearchOverlay /><div className="sticky top-0 z-30">','return <div className="sticky top-0 z-30"><VoiceSearchOverlay />')
                  top.write_text(s,encoding='utf-8')

          # ---------- audit marker ----------

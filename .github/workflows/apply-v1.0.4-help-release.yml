name: Apply v1.0.4 help release note
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply v1.0.4 help release') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Help release notes
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/components/AppTopbar.tsx')
          s=p.read_text()
          s=s.replace('v1.0.3 —','v1.0.4 —')
          p.write_text(s)
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AppTopbar.tsx
          git commit -m "apply v1.0.4 help release" || true
          git push
          git rm -f .github/workflows/apply-v1.0.4-help-release.yml || true
          git commit -m "chore: remove help release workflow" || true
          git push

name: Fix missing operations imports

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore missing component imports
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/app.operations.tsx')
          s = p.read_text(encoding='utf-8')
          imports = 'import { UnitManager } from "@/components/operations/UnitManager";\nimport { FinanceManager } from "@/components/operations/FinanceManager";\n'
          if 'from "@/components/operations/UnitManager"' not in s:
              marker = 'import { PharmacyControls } from "@/components/PharmacyControls";\n'
              if marker not in s:
                  raise SystemExit('Could not find safe import insertion point')
              s = s.replace(marker, imports + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Verify imports and build
        run: |
          grep -n 'components/operations/\(UnitManager\|FinanceManager\)' src/routes/app.operations.tsx
          npm ci
          npm run build

      - name: Commit source fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/app.operations.tsx .github/workflows/fix-unitmanager-imports.yml
          git diff --cached --quiet && exit 0
          git rm .github/workflows/fix-unitmanager-imports.yml
          git add src/routes/app.operations.tsx
          git commit -m 'fix: restore operations component imports'
          git push

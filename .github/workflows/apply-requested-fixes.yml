name: Apply requested pharmacy fixes (retry)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch project
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('.')
          def r(p): return (root/p).read_text(encoding='utf-8')
          def w(p,t): (root/p).write_text(t,encoding='utf-8')

          # Keyboard panel: move it into Settings > Shortcuts.
          p='src/routes/app.tsx'; t=r(p)
          t=t.replace('import { KeyboardSettingsPanel } from "@/components/KeyboardSettingsPanel";\n','')
          t=t.replace('      {pathname === "/app/settings" && <KeyboardSettingsPanel />}\n','')
          w(p,t)
          p='src/components/KeyboardSettingsPanel.tsx'; t=r(p)
          t=t.replace('className="fixed bottom-5 right-5 z-40 w-[min(380px,calc(100vw-2rem))] rounded-xl border bg-background/95 p-4 shadow-xl backdrop-blur"','className="surface-card mt-4 p-6"')
          w(p,t)
          p='src/routes/app.settings.tsx'; t=r(p)
          marker='import { NOTIFICATION_TYPES, NOTIFICATION_LABELS, DEFAULT_NOTIFICATION_PREFERENCES, type NotificationType } from "@/lib/notification-types";'
          if 'import { KeyboardSettingsPanel } from "@/components/KeyboardSettingsPanel";' not in t:
              t=t.replace(marker,marker+'\nimport { KeyboardSettingsPanel } from "@/components/KeyboardSettingsPanel";')
          if '<KeyboardSettingsPanel />' not in t:
              t=t.replace('<TabsContent value="shortcuts">','<TabsContent value="shortcuts"><KeyboardSettingsPanel />',1)
          t=t.replace('className="mb-4 grid h-auto w-full grid-cols-2 gap-1.5 rounded-xl p-1.5 sm:grid-cols-4 lg:grid-cols-8"','className="mb-4 flex w-full gap-1.5 overflow-x-auto rounded-xl p-1.5"')
          t=t.replace('className="min-h-10 px-3 text-sm font-medium"','className="min-h-10 shrink-0 whitespace-nowrap px-3 text-sm font-medium"')
          t=t.replace('<TabsContent value="rackaccess"><RackAccessSettings /></TabsContent>','<TabsContent value="rackaccess" className="mt-0"><RackAccessSettings /></TabsContent>')
          if 'key: "racks", label: "Rack panel"' not in t:
              t=t.replace('{ key: "inventory", label: "Inventory panel" },\n  { key: "stocktake", label: "Stock Take panel" },','{ key: "inventory", label: "Inventory panel" },\n  { key: "stocktake", label: "Stock Take panel" },\n  { key: "racks", label: "Rack panel", actions: [{ key: "racksAdd", label: "Add racks" }] },')
          w(p,t)

          # Messages are available to every user; only admin/manager can message another user.
          p='src/lib/nav.ts'; t=r(p)
          t=t.replace('{ to: "/app/messages", label: "Messages", icon: MessageSquare, perm: "messages", group: "Main" },','{ to: "/app/messages", label: "Messages", icon: MessageSquare, group: "Main" },')
          w(p,t)
          p='src/routes/app.messages.tsx'; t=r(p)
          t=t.replace('import { PermissionGate } from "@/components/PermissionGate";\n','')
          t=t.replace('export const Route = createFileRoute("/app/messages")({ component: () => <PermissionGate perm="messages"><MessagesPage /></PermissionGate> });','export const Route = createFileRoute("/app/messages")({ component: MessagesPage });')
          t=t.replace('const admins = users.filter((u) => u.role === "admin");\n  const recipients = user.role === "admin" ? users.filter((u) => u.id !== user.id) : admins;','const admins = users.filter((u) => u.role === "admin");\n  const canMessageUsers = user.role === "admin" || user.roleTemplate === "manager";\n  const recipients = canMessageUsers ? users.filter((u) => u.id !== user.id) : admins;')
          t=t.replace('const canSend = user.role === "admin" || user.permissions.messagesToAdmin === true;','const canSend = canMessageUsers || user.permissions.messagesToAdmin === true;')
          t=t.replace('{user.role === "admin" ? "Admins can message any other user." : "Your account is allowed to send messages to an administrator."}','{canMessageUsers ? "Admins and Managers can message other users." : "Your account is allowed to send messages to an administrator."}')
          w(p,t)

          # Granular rack permissions + manager-to-user messaging capability.
          p='src/lib/users.ts'; t=r(p)
          t=t.replace('messages?: boolean; racks?: boolean; rackSell?: boolean; rackStocktake?: boolean;','messages?: boolean; racks?: boolean; racksAdd?: boolean; rackSell?: boolean; rackStocktake?: boolean;')
          t=t.replace('viewPinPanel?: boolean; viewNotifications?: boolean; messagesToAdmin?: boolean;','viewPinPanel?: boolean; viewNotifications?: boolean; messagesToAdmin?: boolean; messagesToUsers?: boolean;')
          t=t.replace('messagesToAdmin: true, applyDiscount:','messagesToAdmin: true, messagesToUsers: true, applyDiscount:')
          t=t.replace('messagesToAdmin: false, applyDiscount:','messagesToAdmin: false, messagesToUsers: false, applyDiscount:')
          t=t.replace('notifications: false, prescriptions: false, messages: false, messagesToAdmin: false,','notifications: false, prescriptions: false, messages: true, messagesToAdmin: false, messagesToUsers: false,')
          t=t.replace('racks: true, rackSell: true, rackStocktake: true, operations:','racks: true, racksAdd: true, rackSell: true, rackStocktake: true, operations:')
          t=t.replace('racks: true, rackSell: true, rackStocktake: false, operations:','racks: true, racksAdd: false, rackSell: true, rackStocktake: false, operations:')
          t=t.replace('racks: false, rackSell: false, rackStocktake: false, operations:','racks: false, racksAdd: false, rackSell: false, rackStocktake: false, operations:')
          w(p,t)

          # Duplicate username protection, including admin username.
          p='src/lib/install.ts'; t=r(p)
          old='export async function createUser(input: { username: string; password: string; role: UserRole; permissions?: Partial<import("./users").UserPermissions> }): Promise<StoredUser> { const { saltHex, hashHex } = await hashPassword(input.password); return { id: crypto.randomUUID(), username: input.username.trim(), role: input.role, saltHex, hashHex, permissions: { ...defaultPermissions(input.role), ...(input.permissions ?? {}) } }; }'
          new='export async function createUser(input: { username: string; password: string; role: UserRole; permissions?: Partial<import("./users").UserPermissions> }): Promise<StoredUser> { const username = input.username.trim(); if (!username) throw new Error("Username is required"); if (readInstall()?.users?.some((x) => x.username.trim().toLowerCase() === username.toLowerCase())) throw new Error(`Username "${username}" is already in use`); const { saltHex, hashHex } = await hashPassword(input.password); return { id: crypto.randomUUID(), username, role: input.role, saltHex, hashHex, permissions: { ...defaultPermissions(input.role), ...(input.permissions ?? {}) } }; }'
          if old not in t: raise SystemExit('createUser pattern not found')
          t=t.replace(old,new)
          old='export function upsertUser(u: StoredUser) { const rec = readInstall(); if (!rec) return; const users = rec.users ?? []; const i = users.findIndex((x) => x.id === u.id); if (i >= 0) users[i] = u; else users.push(u); writeInstall({ ...rec, users }); }'
          new='export function upsertUser(u: StoredUser) { const rec = readInstall(); if (!rec) return; const users = rec.users ?? []; const username = u.username.trim(); if (!username) throw new Error("Username is required"); if (users.some((x) => x.id !== u.id && x.username.trim().toLowerCase() === username.toLowerCase())) throw new Error(`Username "${username}" is already in use`); const next = { ...u, username }; const i = users.findIndex((x) => x.id === u.id); if (i >= 0) users[i] = next; else users.push(next); writeInstall({ ...rec, users }); }'
          if old not in t: raise SystemExit('upsertUser pattern not found')
          t=t.replace(old,new); w(p,t)

          # Operations navigation stays in one scrollable row.
          p='src/routes/app.operations.tsx'; t=r(p)
          t=t.replace('className="grid w-full grid-cols-9 gap-1 bg-muted p-1"','className="flex w-full gap-1 overflow-x-auto bg-muted p-1"')
          t=t.replace('className="border border-border/40 bg-background/50 hover:bg-background"','className="shrink-0 whitespace-nowrap border border-border/40 bg-background/50 hover:bg-background"')
          w(p,t)

          # Medicines header wraps cleanly and Add medicine cannot be clipped.
          p='src/routes/app.medicines.tsx'; t=r(p)
          t=t.replace('<header className="mb-5 flex items-center gap-3">','<header className="mb-5 flex flex-wrap items-center gap-3">')
          t=t.replace('<div className="ml-auto flex items-center gap-2">','<div className="ml-auto flex w-full flex-wrap items-center justify-end gap-2 xl:w-auto">')
          t=t.replace('{canAdd && <Button {...pinContext({id:"action:new-medicine",label:"New medicine",kind:"action",to:"/app/medicines"})} onClick={()=>openNew()}>','{canAdd && <Button className="shrink-0" {...pinContext({id:"action:new-medicine",label:"New medicine",kind:"action",to:"/app/medicines"})} onClick={()=>openNew()}>')
          t=t.replace('  }, [meds, q, searchBy]);','  }, [meds, q, searchBy, rackFilter, allowedRackNames]);')

          # Add a typed rack picker component.
          rp=Path('src/components/RackPicker.tsx')
          if not rp.exists():
              rp.write_text('''import type { KeyboardEvent } from "react";\nimport { useMemo } from "react";\nimport { toast } from "sonner";\nimport { useProjectStore } from "@/store/project-store";\nimport { currentUser } from "@/store/session-store";\nimport { Input } from "@/components/ui/input";\n\nexport function RackPicker({ value, onChange }: { value: string; onChange: (value: string) => void }) {\n  const data = useProjectStore((s) => s.data);\n  const mutate = useProjectStore((s) => s.mutate);\n  const racks = useMemo(() => (data?.settings.racks ?? []).filter((r) => r.active), [data?.settings.racks]);\n  const user = currentUser();\n  const canAddRack = user?.role === "admin" || user?.roleTemplate === "manager" || user?.permissions.racksAdd === true;\n  const listId = "medicine-rack-options";\n  function onKeyDown(e: KeyboardEvent<HTMLInputElement>) {\n    if (e.key !== "Enter") return;\n    const name = value.trim();\n    if (!name || racks.some((r) => r.name.trim().toLowerCase() === name.toLowerCase())) return;\n    e.preventDefault();\n    if (!canAddRack) { toast.error("Rack does not exist. Ask an administrator or manager to add it."); return; }\n    if (!window.confirm(`Rack "${name}" does not exist. Do you want to add the rack?`)) return;\n    mutate((d) => {\n      const list = d.settings.racks ?? [];\n      if (!list.some((r) => r.name.trim().toLowerCase() === name.toLowerCase())) d.settings.racks = [...list, { id: crypto.randomUUID(), name, active: true, createdAt: new Date().toISOString() }];\n    });\n    toast.success(`Rack "${name}" added`);\n  }\n  return <div className="space-y-1.5"><Input list={listId} value={value ?? ""} onChange={(e) => onChange(e.target.value)} onKeyDown={onKeyDown} placeholder={racks.length ? "Select or type a rack…" : "No racks — type a rack name"} /><datalist id={listId}>{racks.map((r) => <option key={r.id} value={r.name}>{r.description ?? ""}</option>)}</datalist>{racks.length === 0 && <p className="text-[11px] text-muted-foreground">No racks have been added yet. Type a rack name and press Enter.</p>}</div>;\n}\n''',encoding='utf-8')

          # Replace the rack input only inside MedicineEditor.
          if 'RackPicker' not in t:
              marker='import { canAddMedicine, canEditMedicine, canDeleteMedicine } from "@/lib/granular-permissions";'
              t=t.replace(marker,marker+'\nimport { RackPicker } from "@/components/RackPicker";')
          start=t.find('function MedicineEditor')
          if start < 0: raise SystemExit('MedicineEditor not found')
          tail=t[start:]
          match=re.search(r'<Input\b(?=[^>]*rackNumber)(?:(?!/?>).)*?/?>',tail,re.S)
          if not match: raise SystemExit('Medicine editor rack input not found')
          before=tail[:match.start()]
          state_matches=list(re.finditer(r'const \[(\w+),\s*(\w+)\]\s*=\s*useState(?:<[^>]+>)?\(',before))
          if not state_matches: raise SystemExit('MedicineEditor state variable not found')
          state,setter=state_matches[-1].group(1),state_matches[-1].group(2)
          replacement=f'<RackPicker value={{{state}.rackNumber ?? ""}} onChange={{(rackNumber) => {setter}((v) => ({{ ...v, rackNumber }}))}} />'
          tail=tail[:match.start()]+replacement+tail[match.end():]
          t=t[:start]+tail
          w(p,t)

          # Racks page: Add Rack is restricted to users with rack-add permission.
          p='src/routes/app.racks.tsx'; t=r(p)
          if 'const canAddRack=' not in t:
              t=t.replace('import { PermissionGate } from "@/components/PermissionGate";','import { PermissionGate } from "@/components/PermissionGate";\nimport { currentUser } from "@/store/session-store";')
              t=t.replace('const data=useProjectStore(s=>s.data)!; const mutate=useProjectStore(s=>s.mutate); const racks=data.settings.racks ?? [];','const data=useProjectStore(s=>s.data)!; const mutate=useProjectStore(s=>s.mutate); const racks=data.settings.racks ?? []; const user=currentUser(); const canAddRack=user?.role==="admin"||user?.roleTemplate==="manager"||user?.permissions.racksAdd===true;')
          t=t.replace('<Button onClick={()=>setEditing(emptyRack())}><Plus','<Button disabled={!canAddRack} onClick={()=>setEditing(emptyRack())}><Plus')
          w(p,t)

          print('Patch completed')

      - name: Commit fixes and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-pharmacy-ui-and-access.yml .github/workflows/apply-requested-fixes.yml || true
          git add src
          git commit -m "fix: repair pharmacy messaging rack picker usernames and layouts" || true
          git push

name: Apply UX fixes
on:
  push:
    paths:
      - .github/ux-fixes.trigger
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python3 scripts/apply_ux_fixes.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/apply-ux-fixes.yml scripts/apply_ux_fixes.py .github/ux-fixes.trigger
          git diff --cached --quiet && exit 0
          git commit -m "Fix messages notifications, keyboard UX, context actions, reports and calculator"
          git push

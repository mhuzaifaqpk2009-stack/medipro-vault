name: Validate Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify required UI dependency
        run: npm install @radix-ui/react-scroll-area@^1.2.18 --no-audit --no-fund --package-lock=false

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Windows package build
        run: npx electron-builder --win nsis --publish never

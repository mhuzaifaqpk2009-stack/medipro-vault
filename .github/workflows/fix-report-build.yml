name: Fix ReportExplorer duplicate Metric

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate Metric declaration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/reports/ReportExplorer.tsx')
          text = p.read_text(encoding='utf-8')
          marker = 'function Metric({label,value}:{label:string;value:string})'
          first = text.find(marker)
          second = text.find(marker, first + 1) if first >= 0 else -1
          if second < 0:
              raise SystemExit('Duplicate Metric declaration was not found; refusing to modify the file.')
          line_end = text.find('\n', second)
          if line_end < 0:
              line_end = len(text)
          text = text[:second] + text[line_end + 1:]
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify no duplicate Metric declaration
        run: |
          test "$(grep -Fc 'function Metric({label,value}:{label:string;value:string})' src/components/reports/ReportExplorer.tsx)" -eq 1

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-report-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/reports/ReportExplorer.tsx .github/workflows/fix-report-build.yml
          git commit -m 'fix: remove duplicate report Metric declaration'
          git push origin main

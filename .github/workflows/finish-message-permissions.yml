name: Finish Messages User Access

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add Messages permissions to User Settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/app.settings.tsx')
          text = p.read_text(encoding='utf-8')
          marker = '  { key: "notifications", label: "Notifications & pinned panel", actions: [{ key: "viewNotifications", label: "View notifications" }, { key: "viewPinPanel", label: "View pinned" }, { key: "pinPanel", label: "Pin / unpin" }] },'
          addition = '  { key: "messages", label: "Messages panel", actions: [{ key: "messagesToAdmin", label: "Send messages to Admin" }] },\n' + marker
          if 'label: "Messages panel"' not in text:
              if marker not in text:
                  raise SystemExit('Messages permission insertion point not found')
              text = text.replace(marker, addition, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify production build
        run: npm run build
      - name: Commit changes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/app.settings.tsx
          git rm .github/workflows/finish-message-permissions.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m "feat: add messages permissions to user settings"
          git push origin HEAD:main

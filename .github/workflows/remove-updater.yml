name: Remove legacy source updater

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-updater.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove updater feature
        shell: python
        run: |
          from pathlib import Path
          import re

          settings = Path('src/routes/app.settings.tsx')
          text = settings.read_text(encoding='utf-8')
          text = text.replace('Search, RefreshCw } from "lucide-react";', 'Search } from "lucide-react";')
          text = text.replace(' const [backupBusy, setBackupBusy] = useState(false); const [updateBusy, setUpdateBusy] = useState(false); const [showReset', ' const [backupBusy, setBackupBusy] = useState(false); const [showReset')
          text = re.sub(r'\n  async function doSoftwareUpdate\(\) \{.*?\n  \}\n  function clearBillHistory', '\n  function clearBillHistory', text, count=1, flags=re.S)
          text = re.sub(r'<Button variant="outline" className="ml-auto" onClick=\{\(\) => void doSoftwareUpdate\(\)\} disabled=\{updateBusy\}>.*?</Button><Button onClick=', '<Button onClick=', text, count=1, flags=re.S)
          settings.write_text(text, encoding='utf-8')

          preload = Path('electron/preload.cjs')
          text = preload.read_text(encoding='utf-8')
          text = re.sub(r'\n  updater: \{.*?\n  \},', '', text, count=1, flags=re.S)
          preload.write_text(text, encoding='utf-8')

          secure = Path('electron/secure-main.cjs')
          text = secure.read_text(encoding='utf-8').replace('require("./updater.cjs");\n', '')
          secure.write_text(text, encoding='utf-8')

          package_json = Path('package.json')
          text = package_json.read_text(encoding='utf-8')
          text = text.replace('    "electron-updater": "^6.8.9",\n', '')
          package_json.write_text(text, encoding='utf-8')

          Path('electron/updater.cjs').unlink(missing_ok=True)

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify no updater references remain
        run: |
          ! grep -RniE 'updater:|updater\.cjs|doSoftwareUpdate|Update software|electron-updater|source-build|huzaifa-pharmacy-update-' --exclude-dir=.git .

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/remove-updater.yml
          git add -A
          git diff --cached --quiet || git commit -m 'Remove legacy source updater'
          git push

name: Repair Rack Access PR Trigger

on:
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: github.event.pull_request.title == 'REPAIR-RACK-ACCESS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Rack Access selector and tab class
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/app.settings.tsx')
          text = p.read_text()
          old = 'function RackAccessSettings(){\n  const racks=useProjectStore(s=>s.data?.settings.racks ?? []);'
          new = 'const EMPTY_RACKS: Array<{id: string; name: string; active: boolean}> = [];\n\nfunction RackAccessSettings(){\n  const racks=useProjectStore(s=>s.data?.settings.racks ?? EMPTY_RACKS);'
          if old not in text:
              raise SystemExit('Rack Access selector pattern not found')
          text = text.replace(old, new, 1)
          old_tab = '<TabsTrigger className="min-h-10 shrink-0 whitespace-nowrap px-3 text-sm font-medium" value="rackaccess" className="min-w-[110px]">Rack Access</TabsTrigger>'
          new_tab = '<TabsTrigger className="min-h-10 min-w-[110px] shrink-0 whitespace-nowrap px-3 text-sm font-medium" value="rackaccess">Rack Access</TabsTrigger>'
          if old_tab not in text:
              raise SystemExit('Rack Access tab pattern not found')
          text = text.replace(old_tab, new_tab, 1)
          p.write_text(text)
          PY

      - name: Commit source repair to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/app.settings.tsx
          git commit -m "fix: prevent rack access React update loop"
          git push origin main

name: Materialize core upgrade v2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply embedded upgrade patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          wf=Path('.github/workflows/apply-core-upgrade.yml').read_text()
          start=wf.index("python3 <<'PY'\n")+len("python3 <<'PY'\n")
          end=wf.index("\nPY\n",start)
          script=textwrap.dedent(wf[start:end])
          exec(compile(script,'embedded-upgrade.py','exec'),{})
          PY
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat: strengthen transactions units and pharmacy finance" || exit 0
          git push origin HEAD:main

name: One-shot core finance upgrade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply core pharmacy upgrades
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          def read(p): return (root/p).read_text()
          def write(p,s): (root/p).write_text(s)
          def replace(p, old, new, count=1):
              s=read(p)
              if old not in s:
                  raise SystemExit(f'Missing pattern in {p}: {old[:160]}')
              write(p,s.replace(old,new,count))

          schema=read('src/domain/schema.ts')
          schema=schema.replace('export interface Medicine { id: string;', 'export interface MedicineUnitOption { id: string; label: string; factor: number; price: number; }\nexport interface MedicineUnitConfig { baseUnit: string; options: MedicineUnitOption[]; }\nexport interface Expense { id: string; date: string; category: string; description?: string; amount: number; paymentMethod: "cash" | "card" | "online"; createdBy?: string; }\nexport interface CashDrawerSession { id: string; openedAt: string; openingCash: number; closedAt?: string; closingCash?: number; expectedCash?: number; difference?: number; closedBy?: string; }\nexport interface Medicine { id: string;')
          schema=schema.replace('description?: string; pinOrder?: "first" | "last"; }', 'description?: string; pinOrder?: "first" | "last"; unitConfig?: MedicineUnitConfig; }')
          schema=schema.replace('batchAllocations?: { batchId: string; quantity: number; costPrice: number }[];', 'batchAllocations?: { batchId: string; quantity: number; costPrice: number }[]; unitLabel?: string; unitQuantity?: number; unitFactor?: number;')
          schema=schema.replace('prescriptions?: Prescription[]; }', 'prescriptions?: Prescription[]; expenses?: Expense[]; cashDrawer?: CashDrawerSession; }')
          schema=schema.replace('prescriptions: []; }', 'prescriptions: [], expenses: [], cashDrawer: undefined };')
          schema=schema.replace('export const SCHEMA_VERSION = 3;', 'export const SCHEMA_VERSION = 4;')
          write('src/domain/schema.ts',schema)

          write('src/lib/unit-engine.ts', '''import type { Medicine, MedicineUnitOption, ProjectData } from "@/domain/schema";\n\nexport function unitOptions(medicine?: Medicine): MedicineUnitOption[] {\n  return medicine?.unitConfig?.options?.filter(x => x.factor > 0 && x.label.trim()) ?? [];\n}\n\nexport function defaultUnit(medicine?: Medicine): MedicineUnitOption | undefined {\n  return unitOptions(medicine)[0];\n}\n\nexport function baseQuantity(unitQuantity: number, factor: number): number {\n  return Math.max(0, Math.floor(Number(unitQuantity || 0) * Number(factor || 1)));\n}\n\nexport function configureUnits(data: ProjectData, medicineId: string, baseUnit: string, options: MedicineUnitOption[]): void {\n  const medicine = data.medicines.find(m => m.id === medicineId);\n  if (!medicine) return;\n  const clean = options.filter(o => o.label.trim() && o.factor > 0).map(o => ({ ...o, label: o.label.trim(), factor: Math.max(1, Math.floor(o.factor)), price: Math.max(0, Number(o.price || 0)) }));\n  medicine.unitConfig = clean.length ? { baseUnit: baseUnit.trim() || "piece", options: clean } : undefined;\n}\n''')

          write('src/lib/finance-engine.ts', '''import type { ProjectData, Sale } from "@/domain/schema";\nimport { saleTotal } from "@/lib/sale-math";\n\nfunction inRange(date: string, from?: string, to?: string) {\n  const k = String(date).slice(0,10);\n  return (!from || k >= from) && (!to || k <= to);\n}\n\nfunction returnTotals(data: ProjectData, from?: string, to?: string) {\n  let revenue = 0; let cost = 0;\n  for (const r of data.settings.saleReturns ?? []) {\n    if (!inRange(r.date, from, to)) continue;\n    const sale = data.sales.find(s => s.id === r.saleId);\n    for (const item of r.items) {\n      revenue += item.salePrice * item.quantity;\n      const original = sale?.items.find(i => i.medicineId === item.medicineId);\n      cost += (original?.costPriceAtSale ?? 0) * item.quantity;\n    }\n  }\n  return { revenue, cost };\n}\n\nexport function financeSummary(data: ProjectData, from?: string, to?: string) {\n  let revenue = 0; let cogs = 0;\n  for (const sale of data.sales) {\n    if (sale.status !== "completed" || !inRange(sale.date, from, to)) continue;\n    revenue += saleTotal(sale);\n    cogs += sale.items.reduce((n, item) => n + (item.costPriceAtSale ?? data.medicines.find(m => m.id === item.medicineId)?.purchasePrice ?? 0) * item.quantity, 0);\n  }\n  const returns = returnTotals(data, from, to);\n  const expenses = (data.settings.expenses ?? []).filter(e => inRange(e.date, from, to)).reduce((n,e)=>n+e.amount,0);\n  const netRevenue = revenue - returns.revenue;\n  const grossProfit = netRevenue - (cogs - returns.cost);\n  return { revenue: netRevenue, cogs: Math.max(0,cogs-returns.cost), grossProfit, expenses, netProfit: grossProfit-expenses, returns: returns.revenue };\n}\n\nexport function expectedCash(data: ProjectData, openingCash = 0, from?: string) {\n  let cashSales=0, customerPayments=0, cashExpenses=0;\n  for (const sale of data.sales) if (sale.status === "completed" && inRange(sale.date, from)) cashSales += sale.payments.filter(p=>p.method === "cash").reduce((n,p)=>n+p.amount,0);\n  for (const e of data.settings.customerLedger ?? []) if (e.type === "payment" && inRange(e.date, from)) customerPayments += e.amount;\n  for (const e of data.settings.expenses ?? []) if (e.paymentMethod === "cash" && inRange(e.date, from)) cashExpenses += e.amount;\n  return { expected: openingCash + cashSales + customerPayments - cashExpenses, cashSales, customerPayments, cashExpenses };\n}\n''')

          write('src/lib/transaction-engine.ts', '''import type { ProjectData, SaleReturn, PurchaseReturn } from "@/domain/schema";\nimport { uid } from "@/lib/format";\nimport { allocationsForSaleItem, syncInventoryBatches } from "@/lib/inventory-engine";\n\nfunction restoreSaleStock(data: ProjectData, sale: ProjectData["sales"][number]) {\n  syncInventoryBatches(data);\n  for (const item of sale.items) {\n    for (const a of allocationsForSaleItem(item)) {\n      const batch = (data.settings.inventoryBatches ?? []).find(b => b.id === a.batchId);\n      if (batch) batch.quantity += a.quantity;\n    }\n  }\n  syncInventoryBatches(data);\n}\n\nexport function cancelSale(data: ProjectData, saleId: string, reason = "Sale cancelled", user?: string) {\n  const sale = data.sales.find(s => s.id === saleId);\n  if (!sale) throw new Error("Sale not found");\n  if (sale.status !== "completed") throw new Error("Only a completed sale can be cancelled");\n  restoreSaleStock(data, sale);\n  const credit = sale.payments.filter(p=>p.method === "credit").reduce((n,p)=>n+p.amount,0);\n  if (sale.customerId && credit > 0) {\n    const c=data.customers.find(x=>x.id===sale.customerId); if(c) c.balance=Math.max(0,(c.balance??0)-credit);\n    data.settings.customerLedger=[...(data.settings.customerLedger??[]),{id:uid("cl_"),customerId:sale.customerId,date:new Date().toISOString(),type:"adjustment",amount:-credit,reference:sale.invoiceNumber,note:reason,createdBy:user} as any];\n  }\n  sale.status="cancelled"; sale.notes=[sale.notes, reason].filter(Boolean).join(" · ");\n}\n\nexport function recordSaleReturn(data: ProjectData, saleId: string, requested: Record<string,number>, reason="Customer return", user?: string): SaleReturn {\n  const sale=data.sales.find(s=>s.id===saleId); if(!sale) throw new Error("Sale not found");\n  if(sale.status !== "completed") throw new Error("Only a completed sale can be returned");\n  const previous=data.settings.saleReturns??[];\n  const items:any[]=[];\n  for(const line of sale.items){\n    const already=previous.filter(r=>r.saleId===sale.id).flatMap(r=>r.items).filter(i=>i.medicineId===line.medicineId).reduce((n,i)=>n+i.quantity,0);\n    let remaining=Math.min(Math.max(0,requested[line.medicineId]??0),Math.max(0,line.quantity-already));\n    if(!remaining) continue;\n    const allocations=allocationsForSaleItem(line);\n    for(const a of allocations){ if(!remaining) break; const take=Math.min(remaining,a.quantity); const b=(data.settings.inventoryBatches??[]).find(x=>x.id===a.batchId); if(b)b.quantity+=take; items.push({medicineId:line.medicineId,quantity:take,salePrice:line.salePrice,batchId:a.batchId}); remaining-=take; }\n    if(remaining>0){ const med=data.medicines.find(m=>m.id===line.medicineId); const batch={id:uid("batch_ret_"),sourceKey:`sale-return:${sale.id}:${Date.now()}:${line.medicineId}`,medicineId:line.medicineId,batchNumber:med?.batchNumber,barcode:med?.barcode,quantity:remaining,initialQuantity:remaining,purchasePrice:line.costPriceAtSale??med?.purchasePrice??0,expiryDate:med?.expiryDate,receivedDate:new Date().toISOString()}; data.settings.inventoryBatches=[...(data.settings.inventoryBatches??[]),batch]; items.push({medicineId:line.medicineId,quantity:remaining,salePrice:line.salePrice,batchId:batch.id}); remaining=0; }\n  }\n  if(!items.length) throw new Error("No returnable quantity entered");\n  const ret:SaleReturn={id:uid("sret_"),saleId:sale.id,date:new Date().toISOString(),customerId:sale.customerId,items,reason,createdBy:user};\n  data.settings.saleReturns=[...previous,ret];\n  const value=items.reduce((n,i)=>n+i.salePrice*i.quantity,0);\n  if(sale.customerId){ const c=data.customers.find(x=>x.id===sale.customerId); if(c)c.balance=Math.max(0,(c.balance??0)-value); data.settings.customerLedger=[...(data.settings.customerLedger??[]),{id:uid("cl_"),customerId:sale.customerId,date:ret.date,type:"return",amount:-value,reference:sale.invoiceNumber,note:reason,createdBy:user} as any]; }\n  syncInventoryBatches(data);\n  const returned=previous.filter(r=>r.saleId===sale.id).flatMap(r=>r.items).reduce((n,i)=>n+i.quantity,0)+items.reduce((n,i)=>n+i.quantity,0);\n  if(returned>=sale.items.reduce((n,i)=>n+i.quantity,0)) sale.status="returned";\n  return ret;\n}\n\nexport function recordPurchaseReturn(data: ProjectData, purchaseId: string, requested: Record<string,number>, reason="Supplier return", user?: string): PurchaseReturn {\n  const purchase=data.purchases.find(p=>p.id===purchaseId); if(!purchase) throw new Error("Purchase not found");\n  const previous=data.settings.purchaseReturns??[]; const items:any[]=[];\n  for(let index=0; index<purchase.items.length; index++){ const line=purchase.items[index]; const already=previous.filter(r=>r.purchaseId===purchase.id).flatMap(r=>r.items).filter(i=>i.medicineId===line.medicineId).reduce((n,i)=>n+i.quantity,0); let remaining=Math.min(Math.max(0,requested[line.medicineId]??0),Math.max(0,line.quantity-already)); if(!remaining)continue; const batch=(data.settings.inventoryBatches??[]).find(b=>b.sourceKey===`purchase:${purchase.id}:${index}`); if(batch){const take=Math.min(remaining,batch.quantity);batch.quantity-=take;if(take)items.push({medicineId:line.medicineId,quantity:take,purchasePrice:line.purchasePrice,batchId:batch.id});remaining-=take;} if(remaining) throw new Error(`Cannot return ${line.medicineId}: not enough stock in the purchased batch`); }\n  if(!items.length) throw new Error("No returnable quantity entered");\n  const ret:PurchaseReturn={id:uid("pret_"),purchaseId:purchase.id,date:new Date().toISOString(),supplierId:purchase.supplierId,items,reason,createdBy:user}; data.settings.purchaseReturns=[...previous,ret];\n  const value=items.reduce((n,i)=>n+i.purchasePrice*i.quantity,0); const s=data.suppliers.find(x=>x.id===purchase.supplierId); if(s)s.balance=Math.max(0,(s.balance??0)-value);\n  syncInventoryBatches(data); return ret;\n}\n''')

          sm=read('src/lib/sale-math.ts')
          sm=sm.replace('export function saleSubtotal(sale: Sale): number {\n  return sale.items.reduce((a, l) => a + l.salePrice * l.quantity * (1 - l.discountPercent / 100), 0);\n}', 'function billedUnits(l: { quantity: number; unitQuantity?: number }) { return l.unitQuantity ?? l.quantity; }\nfunction baseUnits(l: { quantity: number; unitQuantity?: number; unitFactor?: number }) { return l.unitQuantity != null ? l.unitQuantity * (l.unitFactor ?? 1) : l.quantity; }\nexport function saleSubtotal(sale: Sale): number {\n  return sale.items.reduce((a, l) => a + l.salePrice * billedUnits(l) * (1 - l.discountPercent / 100), 0);\n}')
          sm=sm.replace('(historicalCost ?? m?.purchasePrice ?? 0) * l.quantity;', '(historicalCost ?? m?.purchasePrice ?? 0) * baseUnits(l);')
          sm=sm.replace('const subtotal = lines.reduce((a, l) => a + l.salePrice * l.quantity * (1 - l.discountPercent / 100), 0);', 'const subtotal = lines.reduce((a, l) => a + l.salePrice * (l.unitQuantity ?? l.quantity) * (1 - l.discountPercent / 100), 0);')
          write('src/lib/sale-math.ts',sm)

          sales=read('src/routes/app.sales.tsx')
          sales=sales.replace('import { allocateStock, syncInventoryBatches, weightedCost } from "@/lib/inventory-engine";', 'import { allocateStock, syncInventoryBatches, weightedCost } from "@/lib/inventory-engine";\nimport { defaultUnit, unitOptions, baseQuantity } from "@/lib/unit-engine";')
          old='function add(medId:string){const med=data.medicines.find(m=>m.id===medId);if(!med)return;setCart(c=>{const i=c.findIndex(l=>l.medicineId===medId);const nextQty=i>=0?c[i].quantity+1:1;if(!confirmForce(med,nextQty))return c;if(i>=0){const copy=[...c];copy[i]={...copy[i],quantity:nextQty,forced:nextQty>med.stockQuantity,forcedSale:nextQty>med.stockQuantity};return copy}return[{medicineId:medId,quantity:1,salePrice:med.salePrice,discountPercent:0,name:med.name,forced:1>med.stockQuantity,forcedSale:1>med.stockQuantity},...c]});setQ("")}'
          new='function add(medId:string){const med=data.medicines.find(m=>m.id===medId);if(!med)return;const opt=defaultUnit(med);const factor=opt?.factor??1;const price=opt?.price??med.salePrice;setCart(c=>{const i=c.findIndex(l=>l.medicineId===medId);const nextBase=i>=0?c[i].quantity+factor:factor;if(!confirmForce(med,nextBase))return c;if(i>=0){const copy=[...c];const old=copy[i];const uq=(old.unitQuantity??(old.quantity/(old.unitFactor??1)))+1;copy[i]={...old,quantity:nextBase,unitQuantity:uq,unitFactor:factor,unitLabel:opt?.label,salePrice:price,forced:nextBase>med.stockQuantity,forcedSale:nextBase>med.stockQuantity};return copy}return[{medicineId:medId,quantity:factor,unitQuantity:1,unitFactor:factor,unitLabel:opt?.label,salePrice:price,discountPercent:0,name:med.name,forced:factor>med.stockQuantity,forcedSale:factor>med.stockQuantity},...c]});setQ("")}'
          if old not in sales: raise SystemExit('sales add pattern missing')
          sales=sales.replace(old,new)
          old='function setQuantity(i:number,value:number){const clean=Math.max(1,Math.floor(value||1));const line=cart[i];if(!line)return;const med=data.medicines.find(m=>m.id===line.medicineId);if(!med)return;if(!confirmForce(med,clean))return;setCart(c=>c.map((l,idx)=>idx===i?{...l,quantity:clean,forced:clean>med.stockQuantity,forcedSale:clean>med.stockQuantity}:l))}'
          new='function setQuantity(i:number,value:number){const clean=Math.max(1,Math.floor(value||1));const line=cart[i];if(!line)return;const med=data.medicines.find(m=>m.id===line.medicineId);if(!med)return;const factor=line.unitFactor??1;const base=baseQuantity(clean,factor);if(!confirmForce(med,base))return;setCart(c=>c.map((l,idx)=>idx===i?{...l,quantity:base,unitQuantity:clean,forced:base>med.stockQuantity,forcedSale:base>med.stockQuantity}:l))}'
          if old not in sales: raise SystemExit('sales quantity pattern missing')
          sales=sales.replace(old,new)
          marker='function updLine(i:number,patch:Partial<typeof cart[number]>){setCart(c=>c.map((l,idx)=>idx===i?{...l,...patch}:l))}'
          addfn=marker+'\n  function changeUnit(i:number, optionId:string){const line=cart[i];const med=line&&data.medicines.find(m=>m.id===line.medicineId);const opt=med&&unitOptions(med).find(o=>o.id===optionId);if(!line||!med||!opt)return;const uq=Math.max(1,line.unitQuantity??1);const base=baseQuantity(uq,opt.factor);if(!confirmForce(med,base))return;setCart(c=>c.map((l,idx)=>idx===i?{...l,quantity:base,unitQuantity:uq,unitFactor:opt.factor,unitLabel:opt.label,salePrice:opt.price,forced:base>med.stockQuantity,forcedSale:base>med.stockQuantity}:l))}'
          if marker not in sales: raise SystemExit('sales upd marker missing')
          sales=sales.replace(marker,addfn)
          # Replace the quantity cell with unit selector + quantity input. Keep existing input props by wrapping only the td.
          pattern=r'<td className="w-20 p-2 text-right">.*?</td>'
          repl='<td className="w-20 p-2 text-right"><div className="flex flex-col items-end gap-1">{unitOptions(data.medicines.find(m=>m.id===l.medicineId)).length>0&&<Select value={unitOptions(data.medicines.find(m=>m.id===l.medicineId)).find(o=>o.label===l.unitLabel)?.id??unitOptions(data.medicines.find(m=>m.id===l.medicineId))[0]?.id} onValueChange={v=>changeUnit(i,v)}><SelectTrigger className="h-7 w-24 text-[10px]"><SelectValue placeholder="Unit"/></SelectTrigger><SelectContent>{unitOptions(data.medicines.find(m=>m.id===l.medicineId)).map(o=><SelectItem key={o.id} value={o.id}>{o.label}</SelectItem>)}</SelectContent></Select>}<Input className="h-8 w-20 text-right" type="number" min={1} value={l.unitQuantity??l.quantity} onChange={e=>setQuantity(i,Number(e.target.value))}/>{l.unitFactor&&l.unitFactor>1&&<span className="text-[10px] text-muted-foreground">{l.quantity} {data.medicines.find(m=>m.id===l.medicineId)?.unitConfig?.baseUnit??"base"}</span>}</div></td>'
          sales2,n=re.subn(pattern,repl,sales,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'quantity cell replacement count={n}')
          sales=sales2
          write('src/routes/app.sales.tsx',sales)

          bills=read('src/routes/app.bills.tsx')
          bills=bills.replace('import type { Sale } from "@/domain/schema";', 'import type { Sale } from "@/domain/schema";\nimport { cancelSale } from "@/lib/transaction-engine";')
          old='function removeBill(sale: Sale) {\n    if (!window.confirm(`Delete bill ${sale.invoiceNumber}? The invoice counter is not affected.`)) return;\n    mutate((d) => { d.sales = d.sales.filter((x) => x.id !== sale.id); });\n    if (selected?.id === sale.id) setSelected(null);\n    toast.success("Bill deleted");\n  }'
          new='function removeBill(sale: Sale) {\n    if (sale.status !== "completed") return toast.error("Only a completed bill can be cancelled");\n    if (!window.confirm(`Cancel bill ${sale.invoiceNumber}? Stock and customer credit will be reversed and the audit history will remain.`)) return;\n    try { mutate((d) => { cancelSale(d, sale.id, "Bill cancelled from Bills", undefined); }); } catch (e) { toast.error(e instanceof Error ? e.message : "Bill could not be cancelled"); return; }\n    setSelected(null); toast.success("Bill cancelled and inventory/credit reversed");\n  }'
          if old not in bills: raise SystemExit('bill remove pattern missing')
          bills=bills.replace(old,new).replace('title="Delete this bill"','title="Cancel this bill"')
          write('src/routes/app.bills.tsx',bills)

          ops=read('src/routes/app.operations.tsx')
          ops=ops.replace('import type { InventoryBatch, PurchaseReturn, SaleReturn } from "@/domain/schema";', 'import type { InventoryBatch, PurchaseReturn, SaleReturn, MedicineUnitOption } from "@/domain/schema";\nimport { recordPurchaseReturn, recordSaleReturn } from "@/lib/transaction-engine";')
          ops=ops.replace('grid-cols-5">', 'grid-cols-7">', 1)
          marker='{canSuppliers&&<TabsTrigger value="suppliers"><Truck className="mr-1 h-4 w-4"/>Supplier Ledger</TabsTrigger>}'
          ins=marker+'<TabsTrigger value="units"><Layers className="mr-1 h-4 w-4"/>Units</TabsTrigger><TabsTrigger value="finance"><ArrowUpRight className="mr-1 h-4 w-4"/>Finance</TabsTrigger>'
          if marker not in ops: raise SystemExit('operations tabs marker missing')
          ops=ops.replace(marker,ins)
          # Replace old return implementations with transaction-safe helpers.
          pat=r'function makeSaleReturn\(\).*?\n  const customerRows='
          rep='function makeSaleReturn(){if(!selectedSale)return toast.error("Select a sale");try{mutate(d=>{recordSaleReturn(d,selectedSale.id,saleReturnQty,"Customer return",user?.username)});toast.success("Sale return recorded, batch stock restored and customer balance adjusted");setSaleReturnQty({});}catch(e){toast.error(e instanceof Error?e.message:"Sale return failed")}}\n  function makePurchaseReturn(){if(!selectedPurchase)return toast.error("Select a purchase");try{mutate(d=>{recordPurchaseReturn(d,selectedPurchase.id,purchaseReturnQty,"Supplier return",user?.username)});toast.success("Purchase return recorded and the purchased batch reduced");setPurchaseReturnQty({});}catch(e){toast.error(e instanceof Error?e.message:"Purchase return failed")}}\n  const customerRows='
          ops,n=re.subn(pat,rep,ops,count=1,flags=re.S)
          if n!=1: raise SystemExit('operations return replacement failed')
          # Add Unit and Finance panels before Returns.
          marker2='{canReturns&&<TabsContent value="returns"'
          panels='''<TabsContent value="units" className="mt-4"><UnitManager /></TabsContent>\n  <TabsContent value="finance" className="mt-4"><FinanceManager /></TabsContent>\n  '''+marker2
          if marker2 not in ops: raise SystemExit('operations return tab content marker missing')
          ops=ops.replace(marker2,panels,1)
          # Append managers before the final file end.
          ops += '''\n\nfunction UnitManager(){\n  const data=useProjectStore(s=>s.data!); const mutate=useProjectStore(s=>s.mutate);\n  const [medicineId,setMedicineId]=useState(data.medicines[0]?.id??""); const [baseUnit,setBaseUnit]=useState("piece"); const [label,setLabel]=useState(""); const [factor,setFactor]=useState(1); const [price,setPrice]=useState(0);\n  const medicine=data.medicines.find(m=>m.id===medicineId); const options=medicine?.unitConfig?.options??[];\n  function add(){if(!medicineId||!label.trim()||factor<1||price<0)return toast.error("Enter a unit label, conversion factor and price");const opt:MedicineUnitOption={id:uid("unit_"),label:label.trim(),factor:Math.floor(factor),price:Number(price)};mutate(d=>{const m=d.medicines.find(x=>x.id===medicineId);if(!m)return;const existing=m.unitConfig?.options??[];m.unitConfig={baseUnit:baseUnit.trim()||"piece",options:[...existing.filter(x=>x.label.toLowerCase()!==opt.label.toLowerCase()),opt]}});setLabel("");setFactor(1);setPrice(medicine?.salePrice??0);toast.success("Selling unit added")}\n  function remove(id:string){mutate(d=>{const m=d.medicines.find(x=>x.id===medicineId);if(m&&m.unitConfig)m.unitConfig.options=m.unitConfig.options.filter(x=>x.id!==id);if(m?.unitConfig&&!m.unitConfig.options.length)m.unitConfig=undefined});}\n  return <div className="grid gap-4 lg:grid-cols-2"><div className="surface-card p-5"><h2 className="font-display font-semibold">Box / Strip / Tablet conversion</h2><p className="mt-1 text-xs text-muted-foreground">Stock is kept in the smallest/base unit. The POS converts the selected selling unit automatically and uses its own selling price.</p><div className="mt-4 grid gap-3"><div><Label>Medicine</Label><Select value={medicineId} onValueChange={v=>{setMedicineId(v);const m=data.medicines.find(x=>x.id===v);setBaseUnit(m?.unitConfig?.baseUnit??"piece");setPrice(m?.salePrice??0)}}><SelectTrigger><SelectValue/></SelectTrigger><SelectContent>{data.medicines.map(m=><SelectItem key={m.id} value={m.id}>{m.name}</SelectItem>)}</SelectContent></Select></div><div><Label>Base / smallest unit</Label><Input value={baseUnit} onChange={e=>setBaseUnit(e.target.value)} placeholder="tablet"/></div><div className="grid grid-cols-3 gap-3"><div><Label>Sell as</Label><Input value={label} onChange={e=>setLabel(e.target.value)} placeholder="Strip"/></div><div><Label>Base units</Label><Input type="number" min={1} value={factor} onChange={e=>setFactor(Number(e.target.value))}/></div><div><Label>Selling price</Label><Input type="number" min={0} value={price} onChange={e=>setPrice(Number(e.target.value))}/></div></div><Button onClick={add}>Add selling unit</Button></div></div><div className="surface-card p-5"><h2 className="font-display font-semibold">Configured units</h2><div className="mt-3 space-y-2">{options.length===0?<p className="text-sm text-muted-foreground">No conversion configured. Existing medicines continue using their normal quantity and price.</p>:options.map(o=><div key={o.id} className="flex items-center justify-between rounded-lg border p-3"><div><b>{o.label}</b><span className="ml-2 text-xs text-muted-foreground">1 {o.label} = {o.factor} {medicine?.unitConfig?.baseUnit??"base units"} · {money(o.price,data.settings.currencySymbol||"$")}</span></div><Button variant="ghost" size="sm" onClick={()=>remove(o.id)}>Remove</Button></div>)}</div></div></div>\n}\n\nfunction FinanceManager(){\n  const data=useProjectStore(s=>s.data!); const mutate=useProjectStore(s=>s.mutate); const user=useSession(s=>s.user); const sym=data.settings.currencySymbol||"$"; const [category,setCategory]=useState("Rent"); const [description,setDescription]=useState(""); const [amount,setAmount]=useState(0); const [paymentMethod,setPaymentMethod]=useState<"cash"|"card"|"online">("cash"); const [opening,setOpening]=useState(0); const [closing,setClosing]=useState(0); const summary=financeSummary(data); const drawer=data.settings.cashDrawer; const opened=drawer&&!drawer.closedAt;\n  function addExpense(){if(amount<=0)return toast.error("Enter an expense amount");mutate(d=>{d.settings.expenses=[...(d.settings.expenses??[]),{id:uid("exp_"),date:new Date().toISOString(),category:category.trim()||"Other",description:description.trim()||undefined,amount:Number(amount),paymentMethod,createdBy:user?.username}];});setAmount(0);setDescription("");toast.success("Expense recorded")}\n  function open(){if(opened)return toast.error("Cash drawer is already open");mutate(d=>{d.settings.cashDrawer={id:uid("drawer_"),openedAt:new Date().toISOString(),openingCash:Number(opening),closedAt:undefined,closingCash:undefined,expectedCash:undefined,difference:undefined};});toast.success("Cash drawer opened")}\n  function close(){if(!drawer||!opened)return toast.error("Open the cash drawer first");const ex=expectedCash(data,drawer.openingCash,drawer.openedAt.slice(0,10)).expected;mutate(d=>{if(!d.settings.cashDrawer)return;d.settings.cashDrawer.closedAt=new Date().toISOString();d.settings.cashDrawer.closingCash=Number(closing);d.settings.cashDrawer.expectedCash=ex;d.settings.cashDrawer.difference=Number(closing)-ex;d.settings.cashDrawer.closedBy=user?.username;});toast.success(`Drawer closed · difference ${money(Number(closing)-ex,sym)}`)}\n  return <div className="grid gap-4"><div className="grid gap-4 md:grid-cols-4"><div className="surface-card p-4"><p className="text-xs text-muted-foreground">Revenue</p><p className="mt-1 text-xl font-bold">{money(summary.revenue,sym)}</p></div><div className="surface-card p-4"><p className="text-xs text-muted-foreground">COGS</p><p className="mt-1 text-xl font-bold">{money(summary.cogs,sym)}</p></div><div className="surface-card p-4"><p className="text-xs text-muted-foreground">Gross profit</p><p className="mt-1 text-xl font-bold">{money(summary.grossProfit,sym)}</p></div><div className="surface-card p-4"><p className="text-xs text-muted-foreground">Net profit</p><p className="mt-1 text-xl font-bold">{money(summary.netProfit,sym)}</p></div></div><div className="grid gap-4 lg:grid-cols-2"><div className="surface-card p-5"><h2 className="font-display font-semibold">Expenses</h2><div className="mt-4 grid gap-3"><div className="grid grid-cols-2 gap-3"><Input value={category} onChange={e=>setCategory(e.target.value)} placeholder="Category e.g. Rent"/><Input value={description} onChange={e=>setDescription(e.target.value)} placeholder="Description"/></div><div className="grid grid-cols-2 gap-3"><Input type="number" min={0} value={amount||""} onChange={e=>setAmount(Number(e.target.value))} placeholder="Amount"/><Select value={paymentMethod} onValueChange={v=>setPaymentMethod(v as any)}><SelectTrigger><SelectValue/></SelectTrigger><SelectContent><SelectItem value="cash">Cash</SelectItem><SelectItem value="card">Card</SelectItem><SelectItem value="online">Online</SelectItem></SelectContent></Select></div><Button onClick={addExpense}>Record expense</Button></div><div className="mt-4 max-h-56 overflow-auto divide-y">{(data.settings.expenses??[]).slice().reverse().slice(0,50).map(e=><div key={e.id} className="flex justify-between py-2 text-sm"><span>{e.category}{e.description?` · ${e.description}`:""}<span className="ml-2 text-xs text-muted-foreground">{new Date(e.date).toLocaleDateString()}</span></span><b>{money(e.amount,sym)}</b></div>)}</div></div><div className="surface-card p-5"><h2 className="font-display font-semibold">Cash drawer</h2><p className="mt-1 text-xs text-muted-foreground">Open and close the physical till. Expected cash uses cash sales, customer payments and cash expenses.</p>{opened?<div className="mt-4 grid gap-3"><div className="rounded-lg border p-3 text-sm">Opened with <b>{money(drawer!.openingCash,sym)}</b> · Expected now <b>{money(expectedCash(data,drawer!.openingCash,drawer!.openedAt.slice(0,10)).expected,sym)}</b></div><Input type="number" min={0} value={closing||""} onChange={e=>setClosing(Number(e.target.value))} placeholder="Actual closing cash"/><Button onClick={close}>Close drawer</Button></div>:<div className="mt-4 grid gap-3"><Input type="number" min={0} value={opening||""} onChange={e=>setOpening(Number(e.target.value))} placeholder="Opening cash"/><Button onClick={open}>Open drawer</Button>{drawer?.closedAt&&<div className="rounded-lg border p-3 text-sm">Last close: {new Date(drawer.closedAt).toLocaleString()} · Difference {money(drawer.difference??0,sym)}</div>}</div>}</div></div></div>\n}\n'''
          write('src/routes/app.operations.tsx',ops)

          # Add finance imports/report types and P&L presentation.
          rep=read('src/components/reports/ReportExplorer.tsx')
          rep=rep.replace('import type { ProjectData } from "@/domain/schema";', 'import type { ProjectData } from "@/domain/schema";\nimport { financeSummary } from "@/lib/finance-engine";')
          rep=rep.replace('"supplier-ledger";', '"supplier-ledger" | "expenses" | "p&l";')
          rep=rep.replace('"supplier-ledger": "Supplier ledger",', '"supplier-ledger": "Supplier ledger",\n  expenses: "Expenses",\n  "p&l": "Profit & Loss",')
          marker='  for (const m of data.medicines) {'
          exp='''  for (const e of data.settings.expenses ?? []) {\n    rows.push({ id: `expense:${e.id}`, date: dateKey(e.date), type: "expenses", reference: e.id, party: e.category, details: e.description || `Expense · ${e.paymentMethod}`, amount: e.amount, profit: null, status: "expense" });\n  }\n'''+marker
          if marker not in rep: raise SystemExit('report medicine marker missing')
          rep=rep.replace(marker,exp,1)
          old='const typeMatch = kind === "all" || row.type === kind || (kind === "profit" && row.type === "sales");'
          new='const typeMatch = kind === "all" || row.type === kind || (kind === "profit" && row.type === "sales") || (kind === "p&l" && (row.type === "sales" || row.type === "expenses"));'
          if old not in rep: raise SystemExit('report typeMatch missing')
          rep=rep.replace(old,new)
          marker2='  const safePage = Math.min(page, pageCount);\n  const visible = filtered.slice((safePage - 1) * pageSize, safePage * pageSize);'
          insert=marker2+'\n  const pnl = useMemo(() => financeSummary(data, from || undefined, to || undefined), [data, from, to]);'
          if marker2 not in rep: raise SystemExit('report safe page marker missing')
          rep=rep.replace(marker2,insert)
          oldret='return <div className="grid gap-4">'
          newret='return <div className="grid gap-4">{kind === "p&l" && <section className="surface-card p-5"><div className="flex items-center justify-between gap-3"><div><h2 className="font-display text-lg font-semibold">Profit & Loss</h2><p className="text-xs text-muted-foreground">Revenue minus cost of goods sold and operating expenses for the selected period.</p></div><div className="text-right"><p className="text-xs text-muted-foreground">Net profit</p><p className="text-2xl font-bold">{money(pnl.netProfit, sym)}</p></div></div><div className="mt-4 grid gap-3 sm:grid-cols-5"><Metric label="Revenue" value={money(pnl.revenue,sym)}/><Metric label="COGS" value={money(pnl.cogs,sym)}/><Metric label="Gross profit" value={money(pnl.grossProfit,sym)}/><Metric label="Expenses" value={money(pnl.expenses,sym)}/><Metric label="Returns" value={money(pnl.returns,sym)}/></div></section>}'
          if oldret not in rep: raise SystemExit('report return marker missing')
          rep=rep.replace(oldret,newret,1)
          # Add Metric helper before ReportExplorer export.
          helper='function Metric({ label, value }: { label: string; value: string }) { return <div className="rounded-lg border bg-muted/20 p-3"><p className="text-xs text-muted-foreground">{label}</p><p className="mt-1 font-semibold tabular-nums">{value}</p></div>; }\n\n'
          rep=rep.replace('export function ReportExplorer(',helper+'export function ReportExplorer(',1)
          write('src/components/reports/ReportExplorer.tsx',rep)

          print('Core upgrade patches applied')
          PY

      - name: Validate
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/one-shot-core-finance.yml
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git rm .github/workflows/one-shot-core-finance.yml
          git add src
          git commit -m "feat: strengthen transactions units and pharmacy finance"
          git push origin HEAD:main

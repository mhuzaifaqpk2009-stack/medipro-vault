name: Apply v1.0.4 fixes

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply v1.0.4 fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          import json,re
          root=Path('.')
          for name in ['package.json','package-lock.json']:
           p=root/name
           if p.exists():
            d=json.loads(p.read_text()); d['version']='1.0.4'
            if name=='package-lock.json' and isinstance(d.get('packages'),dict) and '' in d['packages']: d['packages']['']['version']='1.0.4'
            p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          p=root/'src/App.tsx'; s=p.read_text()
          if 'installLanguageObserver' not in s:
           s=s.replace('import { PasswordPromptHost } from "./components/PasswordPromptDialog";','import { PasswordPromptHost } from "./components/PasswordPromptDialog";\nimport { VoiceSearchOverlay } from "./components/VoiceSearchOverlay";\nimport { installLanguageObserver } from "./lib/language";')
           s=s.replace('  useEffect(() => {\n    const saved = localStorage.getItem("medicore.theme");','  useEffect(() => {\n    const cleanup = installLanguageObserver();\n    return cleanup;\n  }, []);\n\n  useEffect(() => {\n    const saved = localStorage.getItem("medicore.theme");')
           s=s.replace('      <PasswordPromptHost />','      <PasswordPromptHost />\n      <VoiceSearchOverlay />')
          p.write_text(s)
          p=root/'src/lib/language.ts'; s=p.read_text()
          s=s.replace('{code:"ur",name:"Urdu",nativeName:"اردو"}','{code:"ur",name:"Urdu",nativeName:"اردو",dir:"rtl"}')
          s=s.replace('{code:"ar",name:"Arabic",nativeName:"العربية"}','{code:"ar",name:"Arabic",nativeName:"العربية",dir:"rtl"}')
          s=s.replace('{code:"fa",name:"Persian",nativeName:"فارسی"}','{code:"fa",name:"Persian",nativeName:"فارسی",dir:"rtl"}')
          needle='{code:"ko",name:"Korean",nativeName:"한국어"}];'
          if needle in s: s=s.replace(needle,'{code:"ko",name:"Korean",nativeName:"한국어"},{code:"ps",name:"Pashto",nativeName:"پښتو",dir:"rtl"},{code:"uk",name:"Ukrainian",nativeName:"Українська"},{code:"vi",name:"Vietnamese",nativeName:"Tiếng Việt"},{code:"th",name:"Thai",nativeName:"ไทย"}];')
          s=s.replace('localStorage.setItem("medicore.language",code);window.dispatchEvent','localStorage.setItem("medicore.language",code);const lang=APP_LANGUAGES.find(l=>l.code===code);document.documentElement.lang=code;document.documentElement.dir=(lang as any)?.dir||"ltr";window.dispatchEvent')
          s=s.replace('const code=getLanguage();document.documentElement.lang=code;','const code=getLanguage();const lang=APP_LANGUAGES.find(l=>l.code===code);document.documentElement.lang=code;document.documentElement.dir=(lang as any)?.dir||"ltr";')
          p.write_text(s)
          p=root/'src/lib/pins.tsx'; s=p.read_text()
          s=s.replace('const el = (e.target as HTMLElement)?.closest?.("[role=tab]") as HTMLElement | null;','const el = (e.target as HTMLElement)?.closest?.("[role=tab], [data-tab-navigation]") as HTMLElement | null;')
          s=s.replace('const value = el.getAttribute("data-value") || el.getAttribute("value") || label;','const value = el.getAttribute("data-value") || el.getAttribute("value") || el.getAttribute("data-tab-navigation") || label;')
          s=s.replace('function addToMacro() { if (!target.to) return; sessionStorage.setItem("medipro:macro-prefill-route", target.to); navigate({ to: "/app/macros" as any }); close(); }','function addToMacro() { if (!target.to) return; try { sessionStorage.setItem("medipro:macro-prefill-route", target.to); } catch {} close(); requestAnimationFrame(() => { void navigate({ to: "/app/macros" as any }).catch(() => window.location.assign("/app/macros")); }); }')
          s=s.replace('onClick={() => { navigate({ to: target.to! as any }); close(); }}','onClick={() => { const to=target.to!; close(); requestAnimationFrame(() => { void navigate({ to: to as any }).catch(() => window.location.assign(to)); }); }}')
          p.write_text(s)
          p=root/'src/routes/app.workflows.tsx'; s=p.read_text()
          old='function newFlow(template?: Flow) { setEditingFlow(template ? structuredClone({ ...template, id: `custom-${Date.now()}`, title: `${template.title} — Custom`, custom: true }) : { id: `custom-${Date.now()}`, title: "", description: "", permission: "operations", steps: [{ id: `step-${Date.now()}`, label: "", to: "/app/operations" }], custom: true }); }'
          if old in s: s=s.replace(old,'function newFlow(template?: Flow) { try { const base: Flow = template ? JSON.parse(JSON.stringify(template)) : { id: `custom-${Date.now()}`, title: "", description: "", permission: "operations", steps: [{ id: `step-${Date.now()}`, label: "", to: "/app/operations" }], custom: true }; if (template) { base.id=`custom-${Date.now()}`; base.title=`${template.title} — Custom`; base.custom=true; } setEditingFlow(base); } catch { toast.error("Could not open workflow template"); } }')
          p.write_text(s)
          p=root/'src/components/AppTopbar.tsx'; s=p.read_text()
          if 'helpTab' not in s:
           s=s.replace('const [isDark, setIsDark] = useState(false); const [helpOpen, setHelpOpen] = useState(false); const [helpQuery, setHelpQuery] = useState("");','const [isDark, setIsDark] = useState(false); const [helpOpen, setHelpOpen] = useState(false); const [helpQuery, setHelpQuery] = useState(""); const [helpTab, setHelpTab] = useState<"new"|"help">("new");')
           s=s.replace('onClick={() => { setHelpQuery(""); setHelpOpen(true); }}','onClick={() => { setHelpQuery(""); setHelpTab("new"); setHelpOpen(true); }}')
           marker='<DialogDescription>Detailed guidance for the pharmacy workflow, reports, settings, backups, permissions and troubleshooting.</DialogDescription>'
           repl='<div className="mb-3 flex gap-1 rounded-lg border bg-muted/30 p-1"><button type="button" onClick={() => setHelpTab("new")} className={`rounded-md px-3 py-1.5 text-sm font-medium ${helpTab === "new" ? "bg-background shadow-sm" : "text-muted-foreground hover:text-foreground"}`}>What\'s New</button><button type="button" onClick={() => setHelpTab("help")} className={`rounded-md px-3 py-1.5 text-sm font-medium ${helpTab === "help" ? "bg-background shadow-sm" : "text-muted-foreground hover:text-foreground"}`}>Help</button></div>'+marker
           if marker in s: s=s.replace(marker,repl)
           s=s.replace('<div className="max-h-[calc(92vh-190px)] overflow-y-auto px-7 py-6"><div className="grid gap-7 md:grid-cols-2">','<div className="max-h-[calc(92vh-190px)] overflow-y-auto px-7 py-6"><div className="mb-4 rounded-lg border bg-primary/5 p-3"><p className="text-xs font-semibold uppercase tracking-wider text-primary">{helpTab === "new" ? "What\'s New · v1.0.4" : "Help Center"}</p><p className="mt-1 text-xs text-muted-foreground">{helpTab === "new" ? "Navigation context menus, workflow template fixes, voice search, expanded language support and keyboard improvements." : "Search any help topic below."}</p></div><div className="grid gap-7 md:grid-cols-2">')
          p.write_text(s)
          Path('docs/WHAT_NEW_V1.0.4.md').write_text("# What’s New — v1.0.4\n\n- Fixed Dashboard Open and Custom Macro context actions with router-safe navigation and fallback.\n- Right-click in-page navigation tabs exposes Pin, Open and management actions.\n- Workflow Builder templates no longer depend on structuredClone.\n- Language settings support searchable multi-language selection; English remains the default.\n- Voice-search microphone is available on focused search/scan fields.\n- Help now opens with a dedicated What’s New tab and release notes.\n")
      - name: Commit changes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apply v1.0.4 fixes" || true
          git push
          git rm -f .github/workflows/apply-v1.0.4-fixes.yml || true
          git commit -m "chore: remove one-shot v1.0.4 workflow" || true
          git push
